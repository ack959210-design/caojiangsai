要必须包含会议信息、主要讨论、决定和责任期限；不使用Dear或私人信件目的句。","scenarios":[{"id":"minutes-bookfair","title":"旧书交换筹备会议纪要","prompt":"登录后开始三天完整体验，读取本题训练内容。","directions":"","role":"","audience":"","format":"minutes","tags":["学生组织","环保","阅读"],"difficulty":"advanced","examTypes":["one","two"],"sourceLabel":"原创模拟题 · 2027训练版","opening":"","closing":"","salutation":"","signature":"","points":[],"checks":[],"errors":[],"swaps":{},"variants":{},"abc":{"A":[{"en":"","zh":""}],"B":[{"en":"","zh":""}],"C":[{"en":"","zh":""}]}},{"id":"minutes-workshop","title":"英语社口语工作坊会议纪要","prompt":"登录后开始三天完整体验，读取本题训练内容。","directions":"","role":"","audience":"","format":"minutes","tags":["学生组织","教育","校园活动"],"difficulty":"advanced","examTypes":["one","two"],"sourceLabel":"原创模拟题 · 2027训练版","opening":"","closing":"","salutation":"","signature":"","points":[],"checks":[],"errors":[],"swaps":{},"variants":{},"abc":{"A":[{"en":"","zh":""}],"B":[{"en":"","zh":""}],"C":[{"en":"","zh":""}]}}],"format":"minutes"}];window.LAB_COURSES=[{"id":"lesson-01","title":"小作文究竟考什么","summary":"把应用文理解为完成一次沟通任务，先保证信息、行动和读者关系。","sections":[{"title":"先看读者能否做出行动","body":"小作文要求你在给定身份与情境下完成沟通，而不是写一篇泛谈学习意义的文章。读者读完后，应知道发生了什么、为什么与自己有关、需要怎样回应。练习时先把题目改写成一项行动任务，再挑选能完成任务的内容和句式，避免为了展示词汇而偏离目的。","exampleEn":"Could you confirm by Friday whether you can attend the workshop?","exampleZh":"您能否在周五前确认是否参加工作坊？"},{"title":"内容、组织、准确与得体一起看","body":"检查文章时，先核对题目要点是否全部出现，再看顺序能否让读者理解，随后检查语法和用词，最后检查称呼、署名及语气。漂亮的长句不能抵消报名截止时间的遗漏。这里的四步是教学自查方法，不是本站代替阅卷人员给出的官方分数或固定扣分公式。","exampleEn":"Please register at the Students' Union office by May 10.","exampleZh":"请在五月十日前到学生会办公室报名。"},{"title":"区分训练规则与考试规定","body":"本站把正文九十至一百一十五词作为约一百词的练习提醒，把三句中段作为组织工具；它们不是官方公布的硬性分数边界。二零二七年的具体考试要求仍须核对当年考试文件与题目指令。本轮资料核验未获得可直接确认其英语写作细则的官方全文，因此不以预测替代规定。","exampleEn":"Write an email explaining the problem and asking for a replacement.","exampleZh":"写一封邮件，说明问题并请求换货。"}],"faq":[{"q":"高级词多就一定好么？","a":"不能这样判断。准确表达岗位、问题和行动，比不合语境的生僻词更有用；先完成沟通任务，再增加自然的表达变化。"},{"q":"三句中段是官方要求吗？","a":"不是。它是把具体内容、原因或影响、功能行动连起来的教学工具。遇到题目要点较多时，可以合理增补。"},{"q":"本站能给真实考试分数吗？","a":"不能。规则提示只辅助检查关键词和常见句法，文章的完整意义、语气与实际评分需要进一步判断。"}],"quiz":[{"id":"lesson-01-q1","kind":"choice","question":"邀请信最直接的沟通目的是什么？","options":["展示尽可能多的难词","让读者了解活动并决定是否参加","写一篇文化议论文","保证读者一定接受邀请"],"answer":1,"explanation":"邀请需要支持读者做出参加决定，因此活动内容、必要安排与回复方式要明确。","knowledge":"沟通目的"},{"id":"lesson-01-q2","kind":"choice","question":"范文词汇漂亮，但漏掉题目要求的报名地点，应先做什么？","options":["换更多高级词","增加开头寒暄","补上可执行的报名地点","只修改署名"],"answer":2,"explanation":"遗漏信息直接影响任务完成，应优先补齐题目要点。","knowledge":"信息覆盖"},{"id":"lesson-01-q3","kind":"choice","question":"怎样理解本站九十至一百一十五词提醒？","options":["这是教学练习范围，考试以Directions为准","这是2027官方评分边界","超过一词就固定扣两分","所有文体必须恰好100词"],"answer":0,"explanation":"训练阈值不能被误称为官方规定。","knowledge":"训练与考试要求"}],"task":{"prompt":"原创练习：你要邀请同学参加校园文化工作坊。先用中文写出读者看完后需要知道的三项信息，再写一个英文回复请求。","reference":"活动内容与时间地点；参加的意义或体验；回复截止时间与方式。Please let me know by Friday whether you would like to join us.","explanation":"核对三项信息是否帮助读者决定并回应。英文可以使用 confirm、reply 或 let me know，不能因与参考句不同就判错；重点看行动和截止时间是否清楚。"},"sourceNote":"核验日期：2026-10-12。官方公开目录中的英语大纲为历史材料，未据此断言2027写作细则。训练例句均为原创。","sources":[{"title":"教育考试院：全国硕士研究生招生考试大纲目录","url":"https://yankao.neea.edu.cn/html1/category/1509/6235-1.htm"},{"title":"教育部：2027年全国硕士研究生招生工作管理规定","url":"https://www.moe.gov.cn/srcsite/A15/moe_778/s3261/202609/t20260923_1451734.html"}]},{"id":"lesson-02","title":"英语一与英语二：共同训练与区别","summary":"应用文基础可共同练，大作文和科目选择分别核对，避免把历史特点当未来保证。","sections":[{"title":"小作文基础可以共同训练","body":"历史写作资料中，英语一与英语二的应用文部分都采用约一百词的情境写作，并重视任务完成、信息组织与得体表达。两种考试都值得练习审题、书信格式和具体请求。本站据此组织共同基础课程，但不会宣称二零二七年两卷的具体题型、分值与细则已经完全相同。","exampleEn":"I am writing to apply for the volunteer guide position.","exampleZh":"我写信申请志愿讲解员岗位。"},{"title":"不要把大小作文混为一谈","body":"历史材料中，小作文与大作文是分别设置的任务；常见写作分值为英语一共三十分、英语二共二十五分，其中应用文各十分。大作文的长度和任务形式另有要求，不能把应用文的一百词结构照搬过去。图画与图表的常见分布也不等于每年只能出现某一种题材。","exampleEn":"A short email needs a clear purpose; a longer essay needs fuller development.","exampleZh":"短邮件需要明确目的；较长的作文需要更充分的展开。"},{"title":"先确认科目，再核对当年指令","body":"报考英语一还是英语二，应查目标招生单位当年的专业目录与考试科目，不能仅凭学术学位或专业学位名称猜测。临考前还要核对当年英语考试文件；考场上以题目指令确定文体、词数、署名与限制。本课使用历史资料解释训练共性，不预测未来题目或保证大纲不变。","exampleEn":"Follow the required genre, word limit and signature in the Directions.","exampleZh":"按照题目指令要求的文体、词数和署名作答。"}],"faq":[{"q":"英语二是不是只需把英语一范文缩短？","a":"不是。应用文可共享基础训练，但每道题仍有自己的读者、事项与要求；大作文也要按各自指令组织。"},{"q":"专业学位一定考英语二吗？","a":"不能这样推断。以目标招生单位当年的专业目录、考试科目和正式说明为准。"},{"q":"这里确认了2027不变吗？","a":"没有。课程明确区分已核验的历史材料和未确认的未来细则；请使用当年考试文件与实际Directions复核。"}],"quiz":[{"id":"lesson-02-q1","kind":"choice","question":"两种考试的小作文最适合共同训练什么？","options":["每年固定同一道题","审题、信息组织与得体表达","只练图表描述","完全一样的所有阅卷细则"],"answer":1,"explanation":"共同基础是完成应用文沟通任务，不能由此保证当年所有规则完全一致。","knowledge":"共同基础"},{"id":"lesson-02-q2","kind":"choice","question":"确定自己考英语一还是英语二，应优先查什么？","options":["同学的猜测","仅凭专业学位名称","目标单位当年的专业目录与考试科目","网站上的历史范文标题"],"answer":2,"explanation":"实际报考科目由正式招生文件明确，不能一概而论。","knowledge":"科目确认"},{"id":"lesson-02-q3","kind":"choice","question":"哪种说法最严谨？","options":["英语一永远只考图画大作文","英语二所有题型一定更简单","2027要求已经由本站确认不变","历史特点可供训练，当年要求须另行核对"],"answer":3,"explanation":"避免用历史分布或训练经验代替当年规定。","knowledge":"资料时效"}],"task":{"prompt":"用三句话给同学解释：为什么可以一起练应用文、为什么不能混用大小作文要求、自己应到哪里确认报考科目。中文或英文均可。","reference":"应用文的审题和得体表达可以共同训练；大小作文的任务与长度应分别核对；实际科目应查目标单位当年的招生专业目录。","explanation":"只检查三层意思是否成立。允许不同措辞和句序；若写成‘专业学位必考英语二’或‘2027肯定不变’，应具体指出推断缺乏当年文件依据。"},"sourceNote":"历史结构仅作背景，未确认2027写作细则。英语一常见大作文160—200词、英语二约150词属于历史材料描述，实际作答按当年Directions。","sources":[{"title":"教育考试院：2017英语一考试大纲（历史官方目录材料）","url":"https://yankao.neea.edu.cn/html1/report/16103/1379-1.htm"},{"title":"教育考试院：2022英语二考试大纲（历史材料）","url":"https://yankao.neea.edu.cn/html1/report/21115/5092-1.htm"},{"title":"清华大学出版社：考研英语高分写作100篇第2版·写作大纲概述（教学参考）","url":"https://www.tup.tsinghua.edu.cn/upload/books/yz/101427-06.pdf"},{"title":"教育部：2027招生工作管理规定","url":"https://www.moe.gov.cn/srcsite/A15/moe_778/s3261/202609/t20260923_1451734.html"}]},{"id":"lesson-03","title":"认识文体：信件、邮件与通知","sections":[],"faq":[],"quiz":[],"task":null},{"id":"lesson-04","title":"判断题型：看动作，不只看单词","sections" function wrapText(ctx,text,width,font){
  ctx.font=font;const lines=[];
  for(const paragraph of cleanText(text).split('\n')){
    if(!paragraph){lines.push('');continue}
    const tokens=paragraph.match(/[A-Za-z0-9]+(?:['’\-][A-Za-z0-9]+)*|[ \t]+|[^A-Za-z0-9 \t]/gu)||[];
    let line='';
    for(let token of tokens){
      if(ctx.measureText(line+token).width<=width){line+=token;continue}
      if(line.trim()){lines.push(line.trimEnd());line=''}
      token=token.trimStart();
      if(ctx.measureText(token).width<=width){line=token;continue}
      for(const char of token){if(line&&ctx.measureText(line+char).width>width){lines.push(line);line=''}line+=char}
    }
    if(line)lines.push(line.trimEnd());
  }
  return lines;
}
Y.createCardPages=(title,section)=>{
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;

  const titleLines=headerLines.length?headerLines:['训练内容'];
  // Very long section titles flow as ordinary text below a short, stable page heading.
  const compactTitle=titleLines.length<=3?titleLines:['考研英语训练内容'];
  const rows=[];
  const add=(text,font,height,gap=18)=>{if(!text)return;for(const line of wrapText(ctx,text,width,font))rows.push({text:line,font,height});rows.push({text:'',font,height:gap})};
  if(titleLines.length>3)add(s.title,'600 40px "Microsoft YaHei",sans-serif',58,28);
  if(s.en){add('英文','600 27px "Microsoft YaHei",sans-serif',42,8);add(s.en,'40px Georgia,"Times New Roman",serif',62,30)}
  if(s.zh){add('中文','600 27px "Microsoft YaHei",sans-serif',42,8);add(s.zh,'35px "Microsoft YaHei",SimSun,sans-serif',57,30)}
  if(s.points.length){add('训练要点','600 27px "Microsoft YaHei",sans-serif',42,8);s.points.forEach((p,i)=>add((i+1)+'　'+p,'33px "Microsoft YaHei",sans-serif',54,16))}
  if(s.body){add('补充说明','600 27px "Microsoft YaHei",sans-serif',42,8);add(s.body,'33px "Microsoft YaHei",sans-serif',54,24)}
  if(!rows.length)add('本节暂无可导出的内容。','35px "Microsoft YaHei",sans-serif',57);
  const start=110+compactTitle.length*72+38,maxY=1300,pages=[];let page=[],y=start;
  for(const row of rows){if(y+row.height>maxY&&page.length){pages.push({rows:page,title:compactTitle,start});page=[];y=start}page.push(row);y+=row.height}
  if(page.length)pages.push({rows:page,title:compactTitle,start});
  return pages;
};
Y.cardCanvas=(page,index,total)=>{
  const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1440;
  const ctx=canvas.getContext('2d');if(!ctx)throw Error('浏览器不支持教学卡片绘制。');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,1080,1440);ctx.fillStyle='#000';ctx.textBaseline='top';
  ctx.font='600 50px "Microsoft YaHei",sans-serif';page.title.forEach((line,i)=>ctx.fillText(line,88,100+i*72));
  let y=page.start;for(const row of page.rows){ctx.font=row.font;if(row.text)ctx.fillText(row.text,88,y);y+=row.height}
  ctx.font='26px "Microsoft YaHei",sans-serif';ctx.fillText('第 '+(index+1)+' 页 共 '+total+' 页',88,1352);
  return canvas;
};
const canvasBlob=canvas=>new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('卡片导出失败，请重试。')),'image/png'));
async function generateCards(b){

}
Y.exportAction=(action,b)=>{
  if(!['print-export','docx-export','png-card','json-backup','html-export'].includes(action))return false;
  if(action==='json-backup'){
    Y.download('研写Lab学习记录备份.json',JSON.stringify(Y.store,null,2),'application/json;charset=utf-8');return true;

</script><script>
(function(){

Y.slotOptions=k=>{const s=Y.scenario();if(['A','B','C'].includes(k))return s.abc[k];if(['opening','closing'].includes(k)){const out=[{en:s[k],zh:s[k+'Zh']||'',label:'标准表达'}];for(const [v,name] of [['basic','简明表达'],['advanced','自然进阶']]){const item=s.variants?.[v]?.[k];if(item&&item.en!==out[0].en)out.push({...item,label:name})}if(k==='opening'&&/I am writing to/.test(s.opening))out.push({en:s.opening.replace('I am writing to','I would like to'),zh:s.openingZh,label:'自然目的表达'});if(k==='closing'&&Y.tailOptions[Y.ui.type])out.push({...Y.tailOptions[Y.ui.type],label:'简洁功能收束'});return out}return []};

Y.grammarIssues=text=>{const issues=[];const rules=[
{re:/\bI is\b/g,why:'第一人称单数与 be 搭配应为 I am。',replacement:'I am',type:'主谓一致'},
{re:/\bI has\b/g,why:'I 对应 have；has 用于第三人称单数。',replacement:'I have',type:'主谓一致'},
{re:/\byou is\b/gi,why:'you 对应 are。',replacement:'you are',type:'主谓一致'},

const text=Y.fullText();if(Y.isNonLetter())out.push({ok:!/\b(?:Dear|Yours sincerely|I am writing)\b/i.test(text),text:'非书信格式：用文体标题与发布单位，避免私人信件称呼。'});else out.push({ok:/\bDear\b/i.test(text)&&/\b(?:Li Ming|Yours|Best wishes)\b/i.test(text),text:'书信格式：核对称呼、正文分段与署名。'});

function editor(k){const d=Y.draft(),f=d.fields[k],opts=Y.slotOptions(k),locked=!!d.locks[k];const swap=Y.scenario().swaps?.[k];return '<section class="edit-block"><div class="edit-title"><span class="slot">'+(k.length===1?k:k==='opening'?'首':k==='closing'?'尾':'·')+'</span><strong>'+labels[k]+'</strong><button data-action="lock-slot" data-slot="'+k+'" class="'+(locked?'locked':'')+'" aria-pressed="'+locked+'">'+(locked?'已锁定':'锁定')+'</button></div>'+(opts.length?'<div class="choices">'+opts.map((o,i)=>'<button data-action="slot-choice" data-slot="'+k+'" data-index="'+i+'" class="'+(f.choice===i?'selected':'')+'" '+(locked?'disabled':'')+'>'+E(o.label||'表达 '+(i+1))+'</button>').join('')+'</div>':'')+(swap?'<div class="phrase"><label for="swap-'+k+'">句内换词</label><select id="swap-'+k+'" data-swap="'+k+'" '+(locked||f.choice!==0?'disabled':'')+'>'+swap.options.map((o,i)=>'<option value="'+i+'" '+((f.phrase||swap.original)===o.text?'selected':'')+'>'+E(o.text)+'</option>').join('')+'</select><span>默认句式可换词</span></div>':'')+'<label class="hide" for="edit-'+k+'">'+labels[k]+'英文</label><textarea id="edit-'+k+'" data-edit="'+k+'" lang="en" maxlength="2500" '+(locked?'readonly':'')+'>'+E(f.en)+'</textarea><label class="hide" for="zh-'+k+'">'+labels[k]+'中文</label><textarea id="zh-'+k+'" class="translation" data-translation="'+k+'" maxlength="2500" placeholder="中文对照：自定义后请补充" '+(locked?'readonly':'')+'>'+E(f.zh||'')+'</textarea><div class="actions"><button class="text small" data-action="sentence-info" data-slot="'+k+'">句子解析 ↗</button><button class="text small" data-action="copy-slot" data-slot="'+k+'">复制单句</button><button class="text small" data-action="favorite-slot" data-slot="'+k+'">收藏表达</button></div></section>'}
Y.labView=()=>{const s=Y.scenario(),t=Y.type(),d=Y.draft();return Y.heading('THE TEMPLATE LAB','万能模板实验室','首段说明目的，中段完成任务，尾段完成交际。手动全文与模板草稿分别保留。','<button data-action="compare-versions">版本比较</button><button data-action="reset-lab">还原本题</button>')+Y.typeTabs()+'<div class="toolbar"><label>句式难度</label><select id="difficulty" class="input"><option value="basic" '+(d.difficulty==='basic'?'selected':'')+'>基础版 · 简单清楚</option><option value="standard" '+(d.difficulty==='standard'?'selected':'')+'>标准版 · 自然准确</option><option value="advanced" '+(d.difficulty==='advanced'?'selected':'')+'>进阶版 · 结构丰富</option></select><label>正式程度</label><select id="formality" class="input" '+(Y.isNonLetter()?'disabled':'')+'><option value="formal">正式 / 尊重</option><option value="friendly" '+(d.formality==='friendly'?'selected':'')+'>友好 / 熟人</option></select><span class="badge">选项只调整匹配题目的表达</span></div><div class="lab-layout"><div class="panel"><div class="panel-head">01 / 审题与编辑 <small>'+E(t.enName)+'</small></div><div class="panel-body">'+Y.scenarioSelect()+'<p class="en" style="font-size:16px">'+E(s.directions||s.prompt)+'</p><div class="info-grid"><div class="info-cell"><small>我的身份</small>'+E(s.role)+'</div><div class="info-cell"><small>写给谁 / 面向谁</small>'+E(s.audience)+'</div><div class="info-cell"><small>时态参照</small>'+E(s.tense||t.tense)+'</div><div class="info-cell"><small>语气参照</small>'+E(s.tone||t.tone)+'</div></div>'+'<h4>本题示范展开</h4>'+Y.pointList(s.points)+'<details class="details"><summary>区分题给事实与合理补充</summary><h4 style="margin-top:16px">题目明确给出的信息</h4>'+Y.pointList(s.givenFacts||[])+'<h4 style="margin-top:16px">范文中的合理补充</h4>'+Y.pointList(s.reasonableDetails||[])+'<p>补充信息用于让沟通具体；不能改变 Directions 已给的事实。</p></details><p class="float-note">'+E(s.brief)+'</p></div>'+['salutation','opening','A','B','C','closing','signature'].map(editor).join('')+'</div><div class="lab-right"><div class="panel"><div class="panel-head"><div class="preview-tabs">'+[['en','英文全文'],['zh','中文对照'],['edit','手动编辑全文']].map(([v,n])=>'<button data-action="lab-preview" data-preview="'+v+'" class="'+(Y.ui.preview===v?'active':'')+'">'+n+'</button>').join('')+'</div><small>实时更新</small></div><div class="preview" id="lab-preview"></div><div class="word-line"><span id="lab-words"></span><button class="small" data-action="copy-essay">复制全文</button></div></div><div class="panel"><div class="panel-head">02 / 快速规则自查 <small>规则提示，不是AI评分</small></div><div class="panel-body" id="lab-rules"></div></div><div class="actions"><button class="primary" data-action="save-essay">保存作文</button><button data-action="save-draft">保存草稿</button><button data-action="lab-to-exam">独立写一遍 →</button></div><div class="actions"><button data-action="export-current">导出讲义</button><button data-action="lab-to-review">进入批改</button></div><p class="float-note">保存并不代表已经掌握。下一步尝试隐藏句型，仅看 Directions 独立完成。自定义英文的中文需要你填写，AI可用时可另行请求解释。</p></div></div>'};
Y.highlight=text=>{let html=E(text);const words=new Set((Y.scenario().checks||[]).flatMap(c=>(c.allOf||[c.keywords||[]]).flat()));for(const k of [...words].sort((a,b)=>b.length-a.length)){if(k.length<4||k.length>45)continue;const re=new RegExp('(^|[^A-Za-z0-9])('+k.replace(/[.*+?^$()|[\]\\{}]/g,'\\$&')+')(?=$|[^A-Za-z0-9])','gi');html=html.replace(re,'$1<mark>$2</mark>')}return html};

p.innerHTML=html;Y.updateLabStats()};
Y.updateLabStats=()=>{if(Y.ui.view!=='lab')return;const d=Y.draft();document.getElementById('lab-words').textContent=(d.manual!==null?'全文':'正文')+' '+Y.words(d.manual!==null?Y.fullText():Y.body())+' 词 / 目标约 100 词';document.getElementById('lab-rules').innerHTML=Y.labRules().map(c=>'<div class="rule-row '+(c.ok?'':'warn')+'"><b>'+(c.ok?'✓':'!')+'</b><div>'+E(c.text)+'</div></div>').join('')+'<p class="rule-footer">'+E(Y.type().caution)+'<br>关键词只能提示信息覆盖；语义、时态一致性与表达自然度需要人工复核或真实AI服务。</p>'};
Y.applyDifficulty=level=>{const d=Y.draft(),s=Y.scenario();if(Object.values(d.fields).some(f=>f.custom)&&!confirm('你有自定义句。切换难度将替换未锁定的模板句，手动全文不会被覆盖。继续吗？')){Y.render();return}const v=level==='standard'?null:s.variants?.[level];if(level!=='standard'&&!v){Y.toast('本题暂未提供该难度；标准版与自由编辑仍可用');Y.render();return}for(const k of ['opening','A','B','C','closing'])if(!d.locks[k])d.fields[k]=v?{...v[k],choice:-1}:{...(k.length===1?s.abc[k][0]:{en:s[k],zh:s[k+'Zh']}),choice:0};d.difficulty=level;Y.touchDraft();Y.render();Y.toast('已替换未锁定的模板句；手动全文仍保留')};
Y.labAction=(action,b)=>{const k=b.dataset.slot,d=Y.draft();if(action==='lock-slot'){d.locks[k]=!d.locks[k];Y.persist();Y.render()}else if(action==='slot-choice'){if(!Y.labGuard(k))return true;d.fields[k]={...Y.slotOptions(k)[Number(b.dataset.index)],choice:Number(b.dataset.index)};Y.touchDraft();Y.render()}else if(action==='lab-preview'){Y.ui.preview=b.dataset.preview;Y.render()}else if(action==='save-draft'){Y.touchDraft();Y.toast('草稿已保存；可从首页继续学习')}else if(action==='save-essay'){Y.saveEssay()}else if(action==='copy-slot'){Y.copy(d.fields[k].en)}else if(action==='copy-essay'){Y.copy(Y.fullText())}else if(action==='favorite-slot'){const f=d.fields[k],id=Y.id('fav');Y.store.favorites.push({id,en:f.en,zh:f.zh,type:Y.ui.type,slot:k,scenario:Y.ui.scenario,custom:true});Y.persist();Y.toast('已收藏到功能句库')}else if(action==='sentence-info'){const f=d.fields[k],opts=Y.slotOptions(k);Y.openModal(Y.modalHead(labels[k]+'解析')+'<p class="en">'+E(f.en)+'</p><p class="zh">'+E(f.zh||'自定义句暂无中文对照。')+'</p><h3>这句完成什么任务</h3><p>'+E(k==='opening'?'向收件人说明写作目的，并交代必要背景。':k==='A'?'回应题目中的具体信息，不能用抽象评价代替事实。':k==='B'?'说明A为什么合理或会造成什么影响，主语、时态必须与事件一致。':k==='C'?'完成本题的请求、建议、邀请、感谢、补救或参与指引。':k==='closing'?'按交际目的收束，只有需要答复时才期待回复。':'格式信息，应与文体和对象一致。')+'</p><h3>其他表达</h3>'+opts.map(o=>'<div class="example"><p class="en">'+E(o.en)+'</p><p class="zh">'+E(o.zh)+'</p></div>').join('')+'<h3>适用语境与自查</h3><p>'+E(Y.scenario().title)+'。'+E(Y.type().caution)+'</p>'+Y.scenario().errors.map(e=>'<p class="zh">'+E(e.wrong)+' → '+E(e.right)+'<br>'+E(e.why)+'</p>').join(''))}else if(action==='reset-lab'){if(!confirm('还原本题会重置模板句、锁定状态及手动全文。已保存的作文版本仍保留。继续吗？'))return true;Y.store.drafts[Y.ui.scenario]=Y.newDraft();Y.persist();Y.render();Y.toast('已还原本题')}else if(action==='back-generated'){if(d.manual!==null&&!confirm('要切回模板版吗？请先保存当前手动全文；这份手动草稿将被清除。'))return true;d.manual=null;d.manualZh=null;Y.persist();Y.updateLab()}else if(action==='compare-versions'){const s=Y.scenario();Y.openModal(Y.modalHead('句式版本比较')+'<p class="zh">结构变化服务于表达准确性 Y.labInput=el=>{if(el.dataset.edit){const k=el.dataset.edit,d=Y.draft();d.fields[k].en=el.value;d.fields[k].zh='';d.fields[k].choice=-1;d.fields[k].custom=true;const zh=document.getElementById('zh-'+k);if(zh)zh.value='';el.closest('.edit-block').querySelectorAll('.choices button').forEach(b=>b.classList.remove('selected'));const swap=el.closest('.edit-block').querySelector('select');if(swap)swap.disabled=true;Y.touchDraft();if(Y.ui.preview!=='edit')Y.updateLab();else Y.updateLabStats();return true}if(el.dataset.translation){Y.draft().fields[el.dataset.translation].zh=el.value;Y.touchDraft();if(Y.ui.preview==='zh')Y.updateLab();return true}if(el.id==='full-edit'){const d=Y.draft();d.manual=el.value;Y.touchDraft();Y.updateLabStats();return true}if(el.id==='full-zh'){Y.draft().manualZh=el.value;Y.touchDraft();return true}return false};

function migration(){const entries=Y.migrations.filter(m=>Y.ui.migrationTypes.includes(m.id));return Y.heading('ONE THEME / DIFFERENT PURPOSES','一句话多种作文','同一个校园文化节，从不同身份与不同目的出发。保留组织逻辑，重写不相容的事实与语气。')+'<div class="tabs">'+Y.migrations.map(m=>'<button data-action="migration-type" data-type="'+m.id+'" class="'+(Y.ui.migrationTypes.includes(m.id)?'active':'')+'" aria-pressed="'+Y.ui.migrationTypes.includes(m.id)+'">'+E(m.name)+'</button>').join('')+'</div><div class="toolbar"><label>最多并列比较三个题型</label><select id="migration-part" class="input">'+[['opening','首段目的'],['A','具体内容 A'],['B','原因与影响 B'],['C','功能行动 C'],['closing','尾段收束'],['full','完整作文']].map(([k,n])=>'<option value="'+k+'" '+(k===Y.ui.migrationPart?'selected':'')+'>'+n+'</option>').join('')+'</select><button data-action="migration-exercise">练习主语与时态变化</button></div><div class="migration-grid">'+entries.map(m=>{const k=Y.ui.migrationPart;const part=k==='full'?{en:[m.salutation,m.opening.en,['A','B','C'].map(x=>m.abc[x].en).join(' '),m.closing.en,m.signature].filter(Boolean).join('\n\n'),zh:[m.opening.zh,...['A','B','C'].map(x=>m.abc[x].zh),m.closing.zh].join('\n\n')}:m.abc[k]||m[k];return '<article class="migration-entry"><div class="eyebrow">'+E(m.id)+'</div><h3>'+E(m.name)+'</h3><p class="zh">'+E(m.role)+' → '+E(m.audience)+'</p><p class="en" style="white-space:pre-line">'+E(part?.en||m.changedSentence)+'</p><p class="zh" style="white-space:pre-line">'+E(part?.zh||'')+'</p><details class="details"><summary>保留了什么，为什么要改</summary><p>'+E(m.preserved)+'</p><p>替换：'+E(m.replaced)+'</p><p>原因：'+E(m.why)+'</p><p>时态：'+E(m.tense)+'。语气：'+E(m.tone)+'</p></details></article>'}).join('')+'</div><section class="section"><h2>万能程度分析与作文拆解</h2><p class="zh">任意英文不应只凭关键词就被宣称适用于所有题型。需要语义判断时，通过服务端AI检查；未配置时只展示明确的服务状态。</p><label class="field"><span>粘贴任意句型或完整作文</span><textarea id="tools-text" class="english-input" maxlength="15000" placeholder="This would be particularly valuable because…">'+E(Y.workspace().toolsText)+'</textarea></label><div class="actions"><button data-action="ai-tool" data-task="compatibility">分析句型适用范围</button><button data-action="ai-tool" data-task="dissect">拆解完整作文</button><button data-action="ai-tool" data-task="rewrite">迁移到当前题型</button></div><div id="tools-result">'+Y.aiResultHTML(Y.ui.toolsResult)+'</div></section>'}
function analysis(){const s=Y.scenario(),mode=Y.ui.analysisMode,custom=Y.workspace().analysisDirections;return Y.heading('READ BEFORE YOU WRITE','审题训练','把题给事实和合理补充分开，提取身份、读者、目的、文体与信息点。')+Y.typeTabs()+Y.scenarioSelect()+'<div class="tabs">'+[['teaching','教学模式'],['guided','半独立模式'],['exam','考场审题模式']].map(([k,n])=>'<button data-action="analysis-mode" data-mode="'+k+'" class="'+(mode===k?'active':'')+'">'+n+'</button>').join('')+'</div><div class="grid2"><section><h3>英文 Directions</h3><p class="en">'+E(s.directions||s.prompt)+'</p><label class="field"><span>也可以粘贴自己的 Directions（提交后由AI分析）</span><textarea id="analysis-directions" class="english-input" maxlength="12000" placeholder="Paste your directions here…">'+E(custom)+'</textarea></label><button data-action="ai-directions">分析自定义 Directions</button><div id="analysis-ai-result">'+Y.aiResultHTML(Y.ui.analysisResult)+'</div></section><section><h3>先写下自己的判断</h3><div class="analysis-fields">'+[['role','写作者身份'],['audience','收件人 / 面向对象'],['purpose','写作目的'],['format','文体与格式'],['points','必须完成的信息点'],['tone','语气与时态']].map(([k,n])=>'<label class="field"><span>'+n+'</span><textarea data-analysis-field="'+k+'" placeholder="'+(mode==='teaching'?E({role:s.role,audience:s.audience,purpose:Y.type().purpose,format:Y.type().name,points:s.points.join('；'),tone:s.tone}[k]):mode==='guided'&&['role','audience'].includes(k)?E(s[k]):'先独立填写')+'">'+E(Y.workspace().analysisAnswers?.[s.id]?.[k]||'')+'</textarea></label>').join('')+'</div><button class="primary" data-action="analysis-reference">查看参考解析与遗漏提示</button><div id="analysis-reference">'+(Y.ui.showAnalysis?analysisReference():mode==='teaching'?'<p class="float-note">提示已放在输入框中；亲自写一遍，再逐项比对。</p>':'')+'</div></section></div>'}
function analysisReference(){const s=Y.scenario(),a=Y.workspace().analysisAnswers?.[s.id]||{};return '<div class="feedback"><strong>参考解析与自查</strong><p>作者：'+E(s.role)+'。读者：'+E(s.audience)+'。</p><p>文体：'+E(Y.type().name)+'；语气：'+E(s.tone)+'。</p>'+Y.pointList(s.points)+'<h4>题给事实</h4>'+Y.pointList(s.givenFacts||s.points)+'<h4>合理补充</h4>'+Y.pointList(s.reasonableDetails||['仅补充与题目相容的解释，避免改动具体时间与任务。'])+'<p>'+E(s.brief)+'</p><p>'+(['role','audience','purpose','format','points','tone'].filter(k=>!a[k]?.trim()).length?'尚有未填写的审题项目，请补齐后再进入写作。':'你已填写全部项目。自由中文无法仅凭关键词可靠判对，请与以上事实逐项核对。')+'</p></div>'}
Y.currentExercises=()=>Y.type().scenarios.flatMap(s=>s.exercises.map((e,i)=>({...e,id:s.id+':fill:'+i,scenario:s.id})));
function choices(){const s=Y.scenario();const other=Y.types.find(t=>t.id!==Y.ui.type&&t.id!== 'notice')||Y.types[0];const e=s.errors[0];return [{id:s.id+':choice:0',question:'哪一句最适合完成当前题目的 C 功能？',options:[s.abc.C[0].en,other.scenarios[0].abc.C[0].en,'I am writing to introduce myself without explaining any action.'],answer:0,explanation:'功能句必须完成本题的交际任务。'+s.brief,knowledge:'功能句与任务'}, {id:s.id+':choice:1',question:'哪种组织顺序更有助于读者理解？',options:['目的 → 具体内容 → 原因或影响 → 行动 → 收束','先重复感谢三次，再加入活动日期','只写原因，不交代问题与行动'],answer:0,explanation:'三句式提供可迁移的组织逻辑，具体内容与行动仍按题目调整。',knowledge:'逻辑与衔接'}, {id:s.id+':choice:2',question:'根据本题场景，选出更准确得体的表达。',options:[e.wrong,e.right],answer:1,explanation:e.why,knowledge:'语气与语法'}]};
function practice(){const s=Y.scenario(),stage=Y.ui.stage;let content;if(stage===1){const list=choices(),q=list[Y.ui.exercise%list.length];content='<div class="panel"><div class="panel-head">第一阶段 / 功能与表达选择 <small>'+((Y.ui.exercise%list.length)+1)+' / '+list.length+'</small></div><div class="panel-body"><p class="zh">'+E(s.prompt)+'</p><form id="practice-choice"><div class="quiz"><p>'+E(q.question)+'</p>'+q.options.map((o,i)=>'<label><input type="radio" name="choice" value="'+i+'"><span class="en" style="font-size:17px">'+E(o)+'</span></label>').join('')+'</div><div class="actions"><button type="submit" class="primary">提交选择</button><button type="button" data-action="practice-next">下一题 →</button></div></form><div id="practice-feedback">'+feedback()+'</div></div></div>'}else if(stage===2){const list=Y.currentExercises(),e=list[Y.ui.exercise%list.length],response=Y.ui.fillResponses?.[e.id]||[];content='<div class="panel"><div class="panel-head">第二阶段 / 关键表达填空 <small>'+((Y.ui.exercise%list.length)+1)+' / '+list.length+'</small></div><div class="panel-body"><div class="exercise-text">'+e.sentence.split('___').map((p,i,all)=>E(p)+(i<all.length-1?'<input class="gap" data-fill="'+i+'" value="'+E(response[i]||'')+'" aria-label="第 '+(i+1)+' 空" placeholder="词或短语">':'')).join('')+'</div><div class="actions"><button class="primary" data-action="fill-check">检查指定表达</button><button data-action="fill-hint">查看提示</button><button data-action="practice-next">下一题 →</button></div><div id="practice-feedback">'+feedback()+'</div><p class="float-note">这里练习指定结构；同义表达也可能成立，未匹配不等于存在语法错误。开放写作不会用单一参考答案判错。</p></div></div>'}else if(stage===3){content='<div class="panel"><div class="panel-head">第三阶段 / 中文信息点转英文 <small>只显示中文任务</small></div><div class="panel-body"><p>'+E(s.abc.C[0].zh)+'</p><p class="zh">请独立写出能完成这一交际目的的英文。允许不同的语法正确表达。</p><textarea id="practice-open" class="input essay-input" maxlength="15000" placeholder="Write your own sentence…">'+E(Y.workspace().practice?.[s.id]?.translation||'')+'</textarea><div class="actions" style="margin-top:17px"><button class="primary" data-action="open-check">查看自查依据</button><button data-action="open-ai">AI语义点评</button></div><div id="practice-feedback">'+feedback()+'</div></div></div>'}else content='<div class="panel"><div class="panel-head">第四阶段 / 独立完整写作 <small>句型与中文提示已撤除</small></div><div class="panel-body"><p class="en">'+E(s.directions||s.prompt)+'</p><textarea id="practice-open" class="input essay-input" maxlength="15000" placeholder="Write your composition here…">'+E(Y.workspace().practice?.[s.id]?.full||'')+'</textarea><div class="actions" style="margin-top:17px"><button class="primary" data-action="save-independent">保存独立作文</button><button data-action="open-check">提交自查</button><button data-action="open-ai">AI批改</button></div><div id="practice-feedback">'+feedback()+'</div></div></div>';return Y.heading('FADE THE SCAFFOLD','分级互动训练','从选择表达到独立成文，逐渐撤除模板。完成次数不能代替知识掌握。')+Y.typeTabs()+Y.scenarioSelect()+'<div class="practice-stage">'+[[1,'01 选择表达'],[2,'02 句型填空'],[3,'03 中文转英文'],[4,'04 脱离模板']].map(([n,v])=>'<button data-action="practice-stage" data-stage="'+n+'" class="'+(stage===n?'active':'')+'">'+v+'</button>').join('')+'</div>'+content}
function feedback(){return Y.ui.feedback?'<div class="feedback"><strong>'+E(Y.ui.feedback.title)+'</strong>'+E(Y.ui.feedback.text).replace(/\n/g,'<br>')+'</div>':''}
function exam(){const s=Y.scenario(),x=Y.store.exam,active=x?.status==='running'||x?.status==='paused';const same=x?.scenario===s.id;return Y.heading('WRITE WITHOUT A TEMPLATE','独立限时写作','考场模式隐藏模板、翻译与范文。原文自动保存，计时结束后按预设规则处理。')+'<div class="exam-workspace">'+(active&&!same?'<div class="notice">还有另一道题正在计时。请完成或结束该次练习后再换题。<button class="small" data-action="return-exam">回到计时题</button></div>':'')+'<div class="exam-head"><div><div class="eyebrow">'+E(s.title)+'</div><div class="exam-status" id="exam-status">'+E(same?{running:'正在计时',paused:'普通练习已暂停',submitted:'已提交并保存',expired:'计时结束，原文已保留',draft:'准备开始'}[x.status]||'准备开始':'准备开始')+'</div></div><div class="timer" id="timer">12:00</div></div><div class="timer-control"><label class="field"><span>时长</span><select id="exam-duration" '+(active?'disabled':'')+'>'+[10,12,15].map(n=>'<option value="'+n+'" '+((x?.minutes||12)===n?'selected':'')+'>'+n+' 分钟</option>').join('')+'<option value="custom" '+(![10,12,15].includes(x?.minutes||12)?'selected':'')+'>自定义</option></select></label><label class="field"><span>自定义分钟</span><input id="exam-custom" type="number" min="1" max="180" value="'+(x?.minutes||12)+'" '+(active?'disabled':'')+'></label><label class="field"><span>训练模式</span><select id="exam-mode" '+(active?'disabled':'')+'><option value="practice">普通练习 · 可暂停</option><option value="simulation" '+(x?.mode==='simulation'?'selected':'')+'>模拟考场 · 不可暂停</option></select></label><label class="field"><span>计时结束</span><select id="exam-end-rule" '+(active?'disabled':'')+'><option value="preserve">停止计时并保留原文</option><option value="submit" '+(x?.endRule==='submit'?'selected':'')+'>自动提交并保存</option></select></label></div><div class="panel"><div class="panel-body"><p class="en">'+E(s.directions||s.prompt)+'</p><label class="field"><span>英文写作区</span><textarea id="exam-text" class="essay-input" maxlength="15000" placeholder="Write your answer…" '+((active&&!same)||(same&&['submitted','expired'].includes(x.status))?'readonly':'')+'>'+E(same?x.text||'':'')+'</textarea></label><div class="word-line" style="padding-left:0"><span id="exam-words">'+Y.words(same?x.text:'')+' 词</span><span>约100词训练 · 按Directions完成任务</span></div><div class="actions"><button class="primary" data-action="start-exam" '+(active?'disabled':'')+'>'+(same&&['submitted','expired'].includes(x.status)?'重新计时':'开始计时')+'</button><button data-action="pause-exam" '+(!same||!active||x?.mode==='simulation'?'disabled':'')+'>'+(x?.status==='paused'?'继续计时':'暂停')+'</button><button data-action="submit-exam" '+(active&&!same?'disabled':'')+'>提前提交</button></div></div></div>'+(same&&['submitted','expired'].includes(x.status)?'<div class="actions" style="margin-top:20px"><button data-action="exam-reference">查看参考与审题</button><button data-action="exam-review">批改这次作文</button><button data-action="exam-error">加入写作复盘</button></div>':'')+'</div>'}
Y.updateTimer=()=>{const el=document.getElementById('timer');if(!el)return;const x=Y.store.exam;const seconds=x?.scenario===Y.ui.scenario?(x.status==='running'?Math.max(0,Math.ceil((x.endAt-Date.now())/1000)):x.remaining??x.minutes*60):12*60;el.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');el.classList.toggle('urgent',seconds<60&&x?.status==='running')};
Y.submitExam=(expired=false)=>{const x=Y.store.exam;if(!x||x.essayId)return;const s=Y.allScenarios().find(s=>s.id===x.scenario);if(!s)return;if(!x.text.trim()){x.status=expired?'expired':'draft';x.remaining=0;Y.persist();Y.toast('原文为空，没有生成虚假的作文记录');Y.render();return}const e={id:Y.id('essay'),scenario:x.scenario,type:s.typeId,title:s.title,content:x.text,translation:'',kind:'exam',version:1,createdAt:new Date().toISOString(),words:Y.words(x.text),exam:Y.store.profile.exam,durationSeconds:Math.max(0,Math.round((x.minutes||0)*60-Math.max(0,x.status==='paused'?x.remaining:(x.endAt-Date.now())/1000))),mode:x.mode};Y.store.essays.push(e);Y.store.attempts.push({id:Y.id('attempt'),kind:'composition',essay:e.id,type:e.type,time:e.createdAt,words:e.words,durationSeconds:e.durationSeconds});x.essayId=e.id;x.status='submitted';x.remaining=Math.max(0,Math.ceil((x.endAt-Date.now())/1000));Y.persist();Y.toast(expired?'时间结束，已按预设规则保存作文':'作文已提交并保存');if(Y.ui.view==='exam')Y.render()};
Y.tickExam=()=>{const x=Y.store.exam;if(x?.status==='running'&&Date.now()>=x.endAt){x.remaining=0;if(x.endRule==='submit')Y.submitExam(true);else{x.status='expired';Y.persist();Y.toast('计时结束，原文已完整保留');if(Y.ui.view==='exam')Y.render()}}else if(Y.ui.view==='exam')Y.updateTimer()};
setInterval(Y.tickExam,1000);
function errors(){const entries=Y.store.errors.slice().sort((a,b)=>new Date(a.due)-new Date(b.due));return Y.heading('REVIEW THE REASON','错题与复习','记录真实发生的问题，按次日、3天、7天复习；同义表达不能机械判错。','<button data-action="export-errors">导出错题讲义</button>')+'<div class="stats"><div class="stat"><strong>'+entries.filter(e=>e.status!=='mastered').length+'</strong><small>待复习问题</small></div><div class="stat"><strong>'+entries.filter(e=>e.status!=='mastered'&&new Date(e.due)<=new Date()).length+'</strong><small>已到复习时间</small></div><div class="stat"><strong>'+entries.filter(e=>e.status==='mastered').length+'</strong><small>标记已掌握</small></div><div class="stat"><strong>'+Object.keys(Y.store.reviewsDue).length+'</strong><small>主动加入复习的表达</small></div></div>'+(entries.length?entries.map(e=>'<article class="error-entry"><div class="section-title"><h3>'+E(e.knowledge||'表达复盘')+'</h3><span class="badge">'+(e.status==='mastered'?'已掌握':new Date(e.due)<=new Date()?'现在复习':'下次 '+Y.date(e.due))+'</span></div><p>'+E(e.question||e.title||'')+'</p><p class="en">'+E(e.original)+'</p><p class="en">'+E(e.correction||'需人工或AI进一步判断，未给出唯一正确表达。')+'</p><p>'+E(e.reason)+'</p><div class="actions"><button class="small" data-action="retry-error" data-id="'+e.id+'">重做原题</button><button class="small" data-action="similar-error" data-id="'+e.id+'">同类强化</button><button class="small" data-action="review-error" data-id="'+e.id+'">已复习，安排下一次</button><button class="small" data-action="master-error" data-id="'+e.id+'">'+(e.status==='mastered'?'回到复习':'标记掌握')+'</button><select class="input" style="width:auto;font-size:11px" data-error-interval="'+e.id+'" aria-label="复习间隔">'+[1,3,7].map(n=>'<option value="'+n+'" '+(Number(e.interval)===n?'selected':'')+'>'+n+' 天后复习</option>').join('')+'</select></div></article>').join(''):'<div class="empty">还没有错题。选择题、填空与真实批改中的问题可以加入这里。</div>')+'<section class="section"><h2>主动复习的功能句</h2>'+Object.values(Y.store.reviewsDue).map(r=>'<div class="bank-entry"><p class="en">'+E(r.en)+'</p><p class="zh">'+E(r.zh)+'</p><button class="small" data-action="review-sentence" data-id="'+E(r.id)+'">已回忆，3天后再看</button></div>').join('')+'</section>'}
Y.planTasks=()=>{const phases=[{title:'理解读者与目的',view:'courses',desc:'完成一节课程和复习测试。'},{title:'审题提取信息点',view:'analysis',desc:'独立判断身份、目的、文体与要点。'},{title:'完成首中尾段替换',view:'lab',desc:'先写具体内容，再核对理由和功能句。'},{title:'选择与填空强化',view:'practice',desc:'练习词性、时态、介词与语气。'},{title:'同主题跨题型迁移',view:'migration',desc:'比较主语、时态与功能为什么变化。'},{title:'独立写作与限时',view:'exam',desc:'只看Directions完成一篇原创题。'},{title:'复盘并再次表达',view:'errors',desc:'解释错误原因，并用另一种写法完成任务。'}];return Array.from({length:Y.store.plan.days},(_,i)=>({...phases[i%7],type:Y.types[Math.floor(i/2)%Y.types.length].id,index:i}))};

Y.reviewView=()=>{if(!Y.ui.reviewText)Y.ui.reviewText=Y.workspace().reviewText||'';const r=result(),actual=Y.ui.reviewResult?.kind==='ai';return Y.heading('FEEDBACK WITHOUT LOSING YOUR VOICE','作文批改','保留原文，区分明确问题、可选优化和不确定项。AI参考评分不等于官方阅卷结果。')+'<div class="grid2"><section><h3>当前题目与学生原文</h3>'+Y.scenarioSelect()+'<p class="zh">'+E(Y.scenario().prompt)+'</p><label class="field"><span>粘贴或输入英文作文</span><textarea id="review-text" class="essay-input" maxlength="15000" placeholder="Your original composition…">'+E(Y.ui.reviewText)+'</textarea></label><div class="actions"><button class="primary" data-action="ai-review" '+(Y.ui.busy?'disabled':'')+'>'+(Y.ui.busy?'正在请求真实批改…':'提交AI批改')+'</button><button data-action="local-review">快速规则自查</button><button data-action="save-review-original">保存原文</button></div><p class="float-note">AI状态：'+(Y.config.aiAvailable?'服务端已配置；提交后才会产生实际结果。':'尚未配置，不会生成虚构批注或评分。')+'</p><div id="review-error" role="status">'+E(Y.ui.reviewError||'')+'</div><section class="section"><h3>手写作文图片</h3><p class="zh">原始图片只展示和保留，不重绘黑色字迹。图片和独立批注可保存本机，账户之间隔离，但不跨设备同步。先转录、人工确认，再提交文字批改；点击图片可添加独立红色批注。</p><label class="photo-input"><span>选择 PNG / JPEG / WebP 图片</span><input id="photo-input" type="file" accept="image/png,image/jpeg,image/webp"></label>'+(Y.ui.photo?'<div class="image-work" id="annotation-photo"><img src="'+E(Y.ui.photo.dataUrl)+'" alt="学生原始作文，黑色原字未修改"><svg viewBox="0 0 100 100" preserveAspectRatio="none">'+Y.ui.photoMarkers.map((m,i)=>'<circle cx="'+m.x+'" cy="'+m.y+'" r="1.8" fill="none" stroke="#b12828" stroke-width=".3"/><text x="'+(m.x+2)+'" y="'+m.y+'" fill="#b12828" font-size="2.7">'+(i+1)+'</text>').join('')+'</svg></div><div class="annotations-legend">'+Y.ui.photoMarkers.map((m,i)=>'<p>'+(i+1)+' / '+E(m.comment)+'</p>').join('')+'</div><div class="actions"><button data-action="transcribe-photo">AI转录，保留不清楚字迹</button><button data-action="download-original-photo">下载原图</button><button data-action="save-photo">保存图片与批注（本机）</button><button data-action="export-annotations">导出独立批注层</button></div><label class="field" style="margin-top:15px"><span>核对转录文字，看不清的位置保留“待确认”</span><textarea id="photo-transcript" class="english-input" maxlength="15000">'+E(Y.ui.photo.transcription||'')+'</textarea></label><button data-action="confirm-transcript">确认文字，带入批改区</button>':'')+'</section></section><section><div class="tabs review-tabs">'+[['original','原文'],['annotated','逐句批注'],['minimal','最小修改'],['advanced','进阶优化'],['reference','参考范文']].map(([k,n])=>'<button data-action="review-tab" data-view="'+k+'" class="'+(Y.ui.reviewView===k?'active':'')+'">'+n+'</button>').join('')+'</div>'+'<div id="review-score-box">'+(actual&&r?.scoreEstimate!==null?'<div class="score">'+E(r.scoreEstimate)+'<small> / 10</small></div><p class="float-note">AI参考评分，非官方阅卷分数。'+E(r.scoreReason)+'</p>':r?'<div class="notice">本次为'+(actual?'AI未给出可靠分数':'本地规则自查')+'，没有生成总分。</div>':'')+'</div><div id="review-output">'+Y.reviewOutput()+'</div>'+(r?.dimensions?'<section class="section">'+r.dimensions.map(d=>'<div class="row"><div><h3>'+E(d.name)+'</h3><p>'+E(d.feedback)+'</p></div></div>').join('')+'</section>':'')+(r?.uncertain?.length?'<section class="section"><h3>待确认事项</h3>'+Y.pointList(r.uncertain)+'</section>':'')+'<div class="actions" style="margin-top:24px"><button data-action="export-review">导出批改记录</button></div></section></div>'};
Y.saveReviewSource=()=>{const text=Y.ui.reviewText;if(!text.trim()){Y.toast('请先输入作文');return null}let e=Y.store.essays.find(x=>x.id===Y.ui.reviewEssay);if(!e){e=Y.saveEssay('review-source',text);Y.ui.reviewEssay=e?.id}else if(e.content!==text){e.versions=e.versions||[];e.versions.push({version:e.version,content:e.content,time:e.updatedAt||e.createdAt});e.version++;e.content=text;e.words=Y.words(text);if(e.draft){e.draft.manual=text;e.draft.manualZh=null;e.draft.essayId=e.id}e.updatedAt=new Date().toISOString();Y.persist()}return e};
Y.reviewAction=async(a,b)=>{if(a==='review-tab'){Y.ui.reviewView=b.dataset.view;Y.render()}else if(a==='save-review-original')Y.saveReviewSource();else if(a==='local-review'){if(!Y.ui.reviewText.trim()){Y.toast('请先输入作文');return true}const text=Y.ui.reviewText,issues=Y.grammarIssues(text);Y.ui.reviewResult={id:Y.id('local'),kind:'local',source:text,result:{issues,scoreEstimate:null,minimalRevision:localRevision(text,issues),advancedRevision:'',uncertain:['规则检查不覆盖全部语义、拼写、时态和内容问题。'],dimensions:[{name:'任务与信息点',feedback:'请按当前Directions逐项核对；本地规则不能可靠评判同义改写。'}]}};Y.ui.reviewView='annotated';Y.ui.reviewError='';Y.render()}else if(a==='ai-review'){if(Y.ui.busy)return true;const e=Y.saveReviewSource();if(!e)return true;const text=e.content,version=e.version,id=e.id,requestContext=context();Y.ui.busy=true;Y.ui.reviewError='';Y.render();try{const response=await Y.callAI('review',{content:text,directions:Y.scenario().directions,typeId:e.type,version,compositionId:id});if(!current(requestContext))return true;if(response.version!==version||response.compositionId!==id)throw Error('服务返回的作文版本不匹配，未应用结果。');const saved={...response,id:Y.id('review'),essayId:id,version,source:text,kind:'ai',time:new Date().toISOString()};Y.store.reviews.push(saved);Y.persist();if(Y.ui.reviewText===text){Y.ui.reviewResult=saved;Y.ui.reviewView='annotated'}else Y.ui.reviewError='批改属于提交时的版本 '+version+'；当前输入已修改，结果未覆盖。可在作文存档中查看。'}catch(err){if(current(requestContext))Y.ui.reviewError=err.message+' 原文已保留。';}finally{if(current(requestContext)){Y.ui.busy=false;Y.render()}}}else if(a==='review-add-error'){const issue=result().issues[Number(b.dataset.index)];Y.addError({sourceId:Y.ui.reviewResult.id,original:issue.original,correction:issue.replacement,reason:issue.reason,knowledge:issue.type,question:Y.scenario().title,severity:issue.severity,kind:'review'});Y.toast(issue.severity==='error'?'已加入错题本':'已加入自选复盘，并保留其不确定或优化性质')}else if(a==='copy-revision'){Y.copy(Y.ui.reviewView==='minimal'?result().minimalRevision:result().advancedRevision)}else if(a==='export-review'){Y.exportDialog('学生作文批改记录',[{title:'学生原文',en:source(),body:'原文版本 '+(Y.ui.reviewResult?.version||'未提交')},...(result()?.issues||[]).map(i=>({title:i.type+' '+({error:'明确问题',suggestion:'可选优化',uncertain:'待确认'}[i.severity]),en:i.original+'\n'+i.replacement,zh:i.reason+'\n'+i.suggestion}))])}else if(a==='transcribe-photo'){if(!Y.ui.photo)return true;const requestContext=context();Y.ui.reviewError='正在转录图片；不会修改原始字迹。';document.getElementById('review-error').textContent=Y.ui.reviewError;try{const p=Y.ui.photo,response=await Y.callAI('review',{content:'',image:{data:p.dataUrl.split(',')[1],mimeType:p.mimeType},directions:Y.scenario().directions});if(!current(requestContext)||Y.ui.photo!==p)return true;if(!response.result.transcription)throw Error('没有取得可靠转录，请手动输入并确认。');p.transcription=response.result.transcription;Y.ui.reviewError='转录完成。请先确认所有文字；待确认位置不要猜测。';Y.render()}catch(e){if(current(requestContext)){Y.ui.reviewError=e.message;const box=document.getElementById('review-error');if(box)box.textContent=e.message}}}else if(a==='confirm-transcript'){const text=Y.ui.photo?.transcription||'';if(!text.trim()){Y.toast('先填写并核对转录文字');return true}if(/待确认/.test(text)&&!confirm('转录中仍有“待确认”。保留这些标记并带入文字区吗？'))return true;if(Y.ui.reviewText.trim()&&!confirm('文字区已有作文，将保存为保护版本后带入确认后的转录。继续吗？'))return true;if(Y.ui.reviewText.trim())Y.saveReviewSource();Y.ui.reviewText=text;Y.ui.reviewEssay=null;Y.ui.reviewResult=null;Y.workspace().reviewText=text;Y.persist();Y.render()}else if(a==='download-original-photo'){const p=Y.ui.photo;if(p){const bytes=Uint8Array.from(atob(p.dataUrl.split(',')[1]),c=>c.charCodeAt(0));Y.download(p.name,new Blob([bytes],{type:p.mimeType}))}}else if(a==='export-annotations'){const image=document.querySelector('#annotation-photo img'),w=image?.naturalWidth||1000,h=image?.naturalHeight||1400,r=Math.min(w,h)*.018;const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'">'+Y.ui.photoMarkers.map((m,i)=>'<circle cx="'+m.x*w/100+'" cy="'+m.y*h/100+'" r="'+r+'" fill="none" stroke="#b12828" stroke-width="'+r/6+'"/><text x="'+(m.x*w/100+r*1.2)+'" y="'+m.y*h/100+'" font-size="'+r*1.5+'" fill="#b12828">'+(i+1)+'</text>').join('')+'</svg>';Y.download('独立红笔批注层.svg',svg,'image/svg+xml');Y.download('批注说明.json',JSON.stringify({image:Y.ui.photo.name,coordinateSystem:'percent',markers:Y.ui.photoMarkers},null,2),'application/json')}else return false;return true};
Y.reviewInput=el=>{if(el.id==='review-text'){Y.ui.reviewText=el.value;Y.workspace().reviewText=el.value;Y.ui.reviewResult=null;Y.ui.reviewError='原文已修改，旧批改不会套用到新版本。';Y.persist();document.getElementById('review-error').textContent=Y.ui.reviewError;const output=document.getElementById('review-output');if(output)output.innerHTML=Y.reviewOutput();const score=document.getElementById('review-score-box');if(score)score.innerHTML='';return true}if(el.id==='photo-transcript'){Y.ui.photo.transcription=el.value;return true}return false};
Y.reviewChange=el=>{if(el.id==='photo-input'){const file=el.files[0];if(!file)return true;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>8*1024*1024){Y.toast('请选择8MB以内的PNG、JPEG或WebP图片');return true}const uploadContext=context(),reader=new FileReader();reader.onload=()=>{if(!current(uploadContext))return;Y.ui.photo={name:file.name,mimeType:file.type,dataUrl:reader.result,transcription:''};Y.ui.photoMarkers=[];Y.render()};reader.readAsDataURL(file);return true}return false};
document.addEventListener('click',e=>{if(e.target.closest('#annotation-photo')&&Y.ui.photo){const image=document.querySelector('#annotation-photo img');const box=image.getBoundingClientRect();const x=Math.max(0,Math.min(100,(e.clientX-box.left)/box.width*100)),y=Math.max(0,Math.min(100,(e.clientY-box.top)/box.height*100));Y.ui.pendingMarker={x,y};Y.openModal(Y.modalHead('添加独立图片批注')+'<p class="zh">只增加红色批注层，不修改黑色原字。批注内容应指向这个位置真实存在的问题或待确认字迹。</p><form id="photo-marker-form"><label class="field"><span>批注内容</span><textarea id="marker-comment" required maxlength="500"></textarea></label><button class="primary" type="submit">添加批注</button></form>')}});
Y.reviewSubmit=form=>{if(form.id==='photo-marker-form'){Y.ui.photoMarkers.push({...Y.ui.pendingMarker,comment:document.getElementById('marker-comment').value});Y.closeModal();Y.render();return true}return false};
Object.assign(Y.extraViews,{review:Y.reviewView});
})();

</script><script>
(function(){
const Y=window.YX,E=Y.esc;
const privateContext=()=>({epoch:Y.privateUIEpoch??0,userId:Y.user?.id??null,role:Y.user?.role??'guest'});
const sameContext=c=>(Y.privateUIEpoch??0)===c.epoch&&(Y.user?.id??null)===c.userId&&(Y.user?.role??'guest')===c.role;
Y.loadTeacher=async()=>{if(!Y.user||!Y.config.server)return false;const context=privateContext(),state=Y.ui.teacher;if(state.loading)return false;state.loading=true;const canTeach=['teacher','admin'].includes(context.role),isAdmin=context.role==='admin';try{const calls=[Y.api('/api/classrooms'),Y.api('/api/assignments')];if(canTeach)calls.push(Y.api('/api/submissions'),Y.api('/api/teaching'));if(isAdmin)calls.push(Y.api('/api/admin/users'));const res=await Promise.all(calls);if(!sameContext(context)||Y.ui.teacher!==state)return false;state.classes=res[0].classes;state.assignments=res[1].assignments;if(canTeach){state.submissions=res[2].submissions;state.content=res[3].content}if(isAdmin)state.users=res[4].users;state.error='';const panel=document.getElementById('teacher-data');if(panel)panel.innerHTML=teacherData();return true}catch(e){if(!sameContext(context)||Y.ui.teacher!==state)return false;state.error=e.message;const panel=document.getElementById('teacher-data');if(panel)panel.innerHTML='<div class="feedback">'+E(e.message)+'</div>';return false}finally{if(sameContext(context)&&Y.ui.teacher===state)state.loading=false}};
function teacherData(){const t=Y.ui.teacher;if(Y.canTeach())return '<div class="grid2"><section><div class="section-title"><h2>自己的班级</h2><button class="small" data-action="create-class">创建班级</button></div>'+(t.classes.length?t.classes.map(c=>'<div class="class-row"><h3>'+E(c.title)+'</h3><p class="zh">'+c.memberCount+' 位已加入学生 / 邀请加入码 <span class="badge">'+E(c.joinCode)+'</span></p><button class="small" data-action="copy-class-code" data-id="'+c.id+'">复制加入码</button></div>').join(''):'<div class="empty">还没有班级。创建后把加入码交给学生，不会自动发送邀请。</div>')+'</section><section><div class="section-title"><h2>布置与查看作业</h2><button class="small" data-action="create-assignment">布置作业</button></div>'+(t.assignments.length?t.assignments.map(a=>'<div class="class-row"><h3>'+E(a.title)+'</h3><p class="zh">'+E(a.classTitle)+' / '+(a.dueAt?'截止 '+Y.date(a.dueAt):'未设截止')+'</p><p class="en" style="font-size:16px">'+E(a.directions)+'</p><button class="small" data-action="copy-assignment" data-id="'+a.id+'">复制作业内容</button></div>').join(''):'<div class="empty">选择班级并设置Directions，学生端才会显示真实作业。</div>')+'</section></div><section class="section"><div class="section-title"><h2>真实学生提交</h2><button class="small" data-action="export-class-report">导出教学报告</button></div>'+(t.submissions.length?t.submissions.map(s=>'<article class="record"><h3>'+E(s.studentName)+' · '+E(s.assignmentTitle)+'</h3><div class="meta">'+E(s.classTitle)+' / '+Y.date(s.submittedAt)+' / '+Y.words(s.content)+' 词 / 作文版本 '+s.version+'</div><p>'+E(s.content)+'</p><div class="actions"><button class="small" data-action="teacher-review" data-id="'+s.id+'">'+(s.review?'查看 / 修改人工批注':'人工批改')+'</button><span class="badge">'+(s.review?'已复核':'待批改')+'</span></div></article>').join(''):'<div class="empty">没有学生提交；不会用示范作文冒充班级成绩。</div>')+'</section><section class="section"><h2>自己的教学素材</h2><p class="zh">这些原创题目、模板、功能句与范文保存在教师私有空间。布置作业时将需要的 Directions 发布给班级；私有素材不会自动变成官方题库。</p><div class="actions"><button data-action="edit-teaching">编辑素材</button><button data-action="go" data-view="migration">课堂母版迁移演示 ↗</button><button data-action="export-teaching">导出私有讲义</button></div>'+Object.values(t.content||{}).map(c=>'<div class="bank-entry"><h3>'+E(c.title||'教学素材')+'</h3><p class="en">'+E(c.en||c.directions||'')+'</p><p class="zh">'+E(c.zh||'')+'</p><button class="small" data-action="edit-teaching" data-id="'+E(c.id||'')+'">编辑这份素材</button></div>').join('')+'</section>'+(Y.userRole()==='admin'?adminData():'');
return '<section><div class="section-title"><h2>已加入班级</h2><button class="small" data-action="join-class">输入加入码</button></div>'+(t.classes.length?t.classes.map(c=>'<div class="class-row"><h3>'+E(c.title)+'</h3><p class="zh">已加入。教师只能查看你主动提交的作业，不会读取个人草稿。</p></div>').join(''):'<div class="empty">请向老师获取班级加入码，加入后才能看到班级作业。</div>')+'</section><section class="section"><h2>我的班级作业</h2>'+(t.assignments.length?t.assignments.map(a=>'<div class="question-card"><div class="question-meta"><span>'+E(a.classTitle)+'</span><span>'+(a.dueAt?'截止 '+Y.date(a.dueAt):'无截止限制')+'</span><span>'+ (a.submission?'已提交版本 '+a.submission.version:'尚未提交')+'</span></div><h3>'+E(a.title)+'</h3><p class="en">'+E(a.directions)+'</p><button class="primary small" data-action="student-assignment" data-id="'+a.id+'">'+(a.submission?'查看 / 重交作业':'开始独立写作')+'</button>'+(a.submission?.review?'<div class="feedback"><strong>教师人工反馈'+(a.submission.review.score!=null?' · '+a.submission.review.score+'/10 参考分':'')+'</strong>'+E(a.submission.review.comment)+'<br>教师参考评价，非官方阅卷分数。</div>':'')+'</div>').join(''):'<div class="empty">当前班级尚未发布作业。</div>')+'</section>'}

ce'),start=e.selectionStart,end=e.selectionEnd;if(start===end){Y.toast('先在学生原文中选中实际片段');return true}const comment=prompt('针对选中片段写批注（不修改学生原文）：');if(comment?.trim()){Y.ui.manualAnnotations.push({start,end,original:e.value.slice(start,end),comment:comment.trim()});document.getElementById('manual-annotations').innerHTML=annotationsHTML()}}else if(a==='export-class-report'){const graded=t.submissions.filter(s=>s.review?.score!=null);const mean=graded.length?(graded.reduce((n,s)=>n+s.review.score,0)/graded.length).toFixed(1):null;Y.exportDialog('班级教学报告',[{title:'真实提交概览',body:'班级 '+t.classes.length+' 个；作业 '+t.assignments.length+' 项；收到 '+t.submissions.length+' 份提交；已人工评分 '+graded.length+' 份。'+(mean?'已评分提交均分 '+mean+'，仅供教学参考。':'尚无评分，不生成虚拟平均成绩。')},...t.submissions.map(s=>({title:s.studentName+' '+s.assignmentTitle,en:s.content,zh:s.review?.comment||'尚未人工批改'}))])}else if(a==='edit-teaching'){Y.ui.editMaterialId=b.dataset.id||null;const material=t.content[Y.ui.editMaterialId]||{};Y.openModal(Y.modalHead('保存自己的教学素材')+'<form id="teaching-form"><label class="field"><span>类别</span><select id="teaching-kind"><option value="question">原创题目</option><option value="template">模板</option><option value="sentence">功能句</option><option value="model">参考范文</option></select></label><label class="field"><span>标题</span><input id="teaching-title" required maxlength="100" value="'+E(material.title||'')+'"></label><label class="field"><span>英文内容 / Directions</span><textarea id="teaching-en" class="english-input" required maxlength="15000">'+E(material.en||'')+'</textarea></label><label class="field"><span>中文讲解或翻译</span><textarea id="teaching-zh" maxlength="15000">'+E(material.zh||'')+'</textarea></label><button class="primary" type="submit">保存教师私有素材</button><div id="teacher-form-error" role="alert"></div></form>')}else if(a==='export-teaching'){Y.exportDialog('教师原创讲义',Object.values(t.content).map(c=>({title:c.title,en:c.en,zh:c.zh})))}else if(a==='create-teacher-invite'){let r;try{r=await Y.api('/api/admin/invites',{role:'teacher'})}catch(e){if(!sameContext(context))return true;throw e}if(!sameContext(context))return true;const output=document.getElementById('teacher-invite-output');if(output)output.innerHTML='<div class="feedback"><strong>一次性教师邀请码</strong><code>'+E(r.invite.code)+'</code><br>有效至 '+Y.date(r.invite.expiresAt)+'。请直接交给被授权教师；网站不会自动发送消息。</div>'}else return false;return true};

Y.teacherChange=async el=>{
  const context=privateContext();
  if(el.id==='assignment-essay'){const e=Y.store.essays.find(e=>e.id===el.value);if(e){const input=document.getElementById('assignment-text');if(input.value.trim()&&!confirm('写作区已有内容。先保留当前草稿，再带入所选作文吗？'))return true;const w=Y.workspace();w.assignments=w.assignments||{};if(input.value.trim()){Y.store.draftHistory=Y.store.draftHistory||[];Y.store.draftHistory.push({id:Y.id('protected'),title:'带入作文前的作业草稿',content:input.value,time:new Date().toISOString()})}input.value=e.content;w.assignments[Y.ui.assignmentId]=e.content;Y.persist()}return true}

Y.teacherSubmit=async form=>{
  const id=form.id;
  if(!['class-form','join-class-form','assignment-form','student-assignment-form','teacher-review-form','teaching-form'].includes(id))return false;
  const context=privateContext(),btn=form.querySelector('[type=submit]');
  if(!Y.user||!Y.config.server)return true;
  const sameForm=()=>sameContext(context)&&document.getElementById(id)===form;
  btn.disabled=true;
  try{
    if(id==='class-form')await Y.api('/api/classrooms',{title:document.getElementById('class-title').value});
    else if(id==='join-class-form')await Y.api('/api/classrooms/join',{code:document.getElementById('join-code').value});
    else if(id==='assignment-form'){
      const due=document.getElementById('assignment-due').value;
      await Y.api('/api/assignments',{classId:Number(document.getElementById('assignment-class').value),title:document.getElementById('assignment-title').value,directions:document.getElementById('assignment-directions').value,typeId:Y.ui.type,scenarioId:Y.ui.scenario,dueAt:due?new Date(due+':00+08:00').toISOString():null});
    }else if(id==='student-assignment-form'){
      const essay=Y.store.essays.find(e=>e.id===document.getElementById('assignment-essay').value);
      await Y.api('/api/assignments/'+Y.ui.assignmentId+'/submit',{content:document.getElementById('assignment-text').value,compositionId:essay?.id||null,version:essay?.version||1});
    }else if(id==='teacher-review-form'){
      const score=document.getElementById('teacher-score').value;
      await Y.api('/api/submissions/'+Y.ui.submissionId+'/review',{comment:document.getElementById('teacher-comment').value,score:score===''?null:Number(score),annotations:Y.ui.manualAnnotations});
    }else if(id==='teaching-form'){
      const content=structuredClone(Y.ui.teacher.content),materialId=Y.ui.editMaterialId||Y.id('material');
      content[materialId]={id:materialId,kind:document.getElementById('teaching-kind').value,title:document.getElementById('teaching-title').value,en:document.getElementById('teaching-en').value,zh:document.getElementById('teaching-zh').value};
      await Y.api('/api/teaching',{content},'PUT');
    }
    if(!sameContext(context))return true;
    if(sameForm())Y.closeModal();
    await Y.loadTeacher();
    if(sameContext(context))Y.toast('操作已保存到真实账户服务');
  }catch(e){
    if(sameForm()){const error=form.querySelector('#teacher-form-error');if(error)error.textContent=e.message}
  }finally{if(sameForm())btn.disabled=false}
  return true;
};

(function(){
const Y=window.YX;
const privateContext=()=>({epoch:Y.privateUIEpoch??0,userId:Y.user?.id??null});
const sameContext=c=>(Y.privateUIEpoch??0)===c.epoch&&(Y.user?.id??null)===c.userId;
const key=context=>context.userId===null?'guest':'account:'+context.userId;
let loadSequence=0;
function database(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('浏览器不支持图片本机持久保存，请下载原图和批注层。'));return}const request=indexedDB.open('yanxie-private-photos',1);request.onupgradeneeded=()=>request.result.createObjectStore('photos');request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
Y.savePhoto=async()=>{
  const context=privateContext();
  if(!Y.ui.photo){Y.toast('请先选择图片');return false}
  const snapshot=structuredClone({photo:Y.ui.photo,markers:Y.ui.photoMarkers,savedAt:new Date().toISOString()});
  let db;
  try{
    db=await database();
    if(!sameContext(context))return false;
    await new Promise((resolve,reject)=>{const transaction=db.transaction('photos','readwrite');transaction.objectStore('photos').put(snapshot,key(context));transaction.oncomplete=resolve;transaction.onerror=()=>reject(transaction.error);transaction.onabort=()=>reject(transaction.error||Error('图片保存已取消'))});
    if(!sameContext(context))return false;
    Y.toast('图片与独立批注已保存本机；不会跨设备同步');return true;
  }catch(e){if(!sameContext(context))return false;throw e}
  finally{db?.close()}
};
Y.loadPhoto=async()=>{
  const context=privateContext(),sequence=++loadSequence;
  Y.ui.photo=null;Y.ui.photoMarkers=[];
  let db;
  try{
    db=await database();if(!sameContext(context)||sequence!==loadSequence)return false;
    const record=await new Promise((resolve,reject)=>{const request=db.transaction('photos','readonly').objectStore('photos').get(key(context));request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});
    if(!sameContext(context)||sequence!==loadSequence)return false;
    if(record?.photo?.dataUrl&&!Y.ui.photo&&!Y.ui.photoMarkers.length){Y.ui.photo=record.photo;Y.ui.photoMarkers=Array.isArray(record.markers)?record.markers:[]}
    return true;
  }catch{return false}
  finally{db?.close()}
};
const prior=Y.reviewAction;Y.reviewAction=async(a,b)=>{if(a==='save-photo'){const context=privateContext();try{await Y.savePhoto()}catch(e){if(sameContext(context))Y.toast(e.message||'保存失败，请下载原图备份')}return true}return prior(a,b)};
})();

function orderHTML(order,admin=false){return '<article class="class-row"><h3>'+E(order.planName||'训练订阅')+' / '+money(order.priceCents)+'</h3><p class="zh">订单 '+E(order.orderNo||order.id)+' / '+E({pending:'待付款',claimed:'已提交付款说明，等待核对',confirmed:'已核对并开通',rejected:'未确认，请查看处理说明'}[order.status]||order.status)+' / '+order.days+' 天'+(admin?' / '+E(order.userName||order.name||'')+' '+E(order.userEmail||order.email||''):'')+'</p>'+(order.reference?'<p>付款说明：'+E(order.reference)+'</p>':'')+(order.note?'<p>处理说明：'+E(order.note)+'</p>':'')+'<div class="actions">'+(!admin&&['pending','claimed'].includes(order.status)?'<button data-action="view-order" data-id="'+order.id+'">查看本订单收款码</button><button data-action="payment-claim" data-id="'+order.id+'">提交 / 更新付款说明</button>':'')+(admin&&['pending','claimed'].includes(order.status)?'<button data-action="confirm-payment" data-id="'+order.id+'">已核对到账，开通</button><button data-action="reject-payment" data-id="'+order.id+'">暂不确认</button>':'')+'</div></article>'}
function billingPanel(){const b=Y.billing||{},m=Y.membership||{};return '<div class="grid2"><section class="panel"><div class="panel-head">账户体验与到期时间</div><div class="panel-body"><h2>'+E(statusNames[m.status]||'服务暂不可用')+'</h2>'+(m.trialEndsAt?'<p>三天体验至 '+E(Y.date(m.trialEndsAt))+'</p>':'')+(m.paidUntil?'<p>订阅有效至 '+E(Y.date(m.paidUntil))+'</p>':'')+'<p class="zh">免费部分：学习首页、前两节基础课、个人作文与备份。试用从学生注册时开始，按服务器时间连续72小时计算。</p><div class="actions">'+(!Y.user?'<button class="primary" data-action="account">登录 / 注册</button>':'')+'<button data-action="refresh-subscription">刷新权限与订单</button><button data-action="go" data-view="records">保留的作文</button></div></div></section><section class="panel"><div class="panel-head">'+E(b.planName||'月度训练订阅（30天）')+'</div><div class="panel-body"><div class="score">'+(b.priceCents==null?'—':E(b.priceCents/100))+'<small> 元 / '+E(b.days||30)+' 天</small></div><p class="zh">一次扫码付款，核对后开通；到期手动续费，无自动扣款。'+E(b.contact||'')+'</p>'+(!b.configured?'<div class="notice">订阅收款尚未配置完成，目前不能创建付款订单。</div>':'<button class="primary" data-action="create-order" '+(!Y.user||!Y.config.server?'disabled':'')+'>创建订阅订单，查看收款码</button>')+'</div></section></div>'}
function adminPanel(){return '<section class="section"><div class="section-title"><h2>订阅管理</h2><div class="actions"><button data-action="billing-settings">设置价格与收款码</button><button data-action="admin-orders">刷新待核对订单</button><button data-action="grant-subscription">手动开通 / 延长</button></div></div><p class="zh">请在微信或支付宝核对真实收款金额、时间和付款人后再开通。学生提交付款说明不会获得权限。每次处理记录管理员及备注。</p><div id="admin-orders">'+(Y.adminOrders.length?Y.adminOrders.map(o=>orderHTML(o,true)).join(''):'暂无已加载订单，点击刷新查看。')+'</div></section>'}
Y.subscriptionView=()=>Y.heading('TRY FIRST. CONTINUE WHEN READY.','体验与订阅','三天完整体验。前两节课持续免费，个人原文与学习记录始终保留。')+(offline()?'<div class="notice">这是已经交付的离线学习版，无账户订阅或收费锁。在线账户版才提供服务器试用计时、订阅和班级服务。</div><button data-action="go" data-view="lab">继续离线训练</button>':(Y.membershipError?'<div class="notice">'+E(Y.membershipError)+'</div>':'')+billingPanel()+'<section class="section"><h2>我的实际订单</h2><p class="zh">仅显示当前账户订单，不预置付款成功记录。</p><div id="member-orders">'+(Y.memberOrders.length?Y.memberOrders.map(o=>orderHTML(o)).join(''):Y.user?'点击“刷新权限与订单”取得自己的订单。':'登录后查看自己的订单。')+'</div></section>'+(Y.user?.role==='admin'?adminPanel():''));
function paymentDialog(order){const b=order.paymentSnapshot||Y.billing||{};Y.openModal(Y.modalHead('订单 '+(order.orderNo||order.id))+'<p>'+E(order.planName)+' / 应付 '+money(order.priceCents)+' / '+order.days+' 天</p><p class="zh">请核对收款人后付款。不要重复支付；付款后提交交易时间或订单尾号，等待老师核实。扫码结果和实际到账由付款平台决定，本网站不自动确认。</p><div class="grid2 payment-codes">'+[['wechatQr','微信支付'],['alipayQr','支付宝']].map(([k,n])=>b[k]?'<section><h3>'+n+'</h3><img src="'+E(b[k])+'" alt="'+n+'收款码，原图"><p class="zh">'+n+'扫一扫；请核对实际收款人。</p></section>':'').join('')+'</div><p>'+E(b.contact||'')+'</p><button class="primary" data-action="payment-claim" data-id="'+order.id+'">已付款，提交说明供核对</button>')}
async function getOrders(admin=false){const c=context(),r=await Y.api(admin?'/api/admin/orders':'/api/orders');if(!same(c))return;if(admin)Y.adminOrders=r.orders;else Y.memberOrders=r.orders;Y.render()}
Y.subscriptionAction=async(a,b)=>{const c=context();try{if(a==='free-courses'){Y.ui.course=0;Y.closeModal();Y.go('courses')}else if(a==='view-order'){const order=Y.memberOrders.find(o=>String(o.id)===b.dataset.id);if(order)paymentDialog(order)}else if(a==='refresh-subscription'){await Y.refreshMembership(true);if(!same(c))return true;if(Y.user)await getOrders();else Y.render()}else if(a==='create-order'){const r=await Y.api('/api/orders',{});if(!same(c))return true;Y.memberOrders=[r.order,...Y.memberOrders.filter(o=>o.id!==r.order.id)];paymentDialog(r.order)}else if(a==='payment-claim'){const order=Y.memberOrders.find(o=>String(o.id)===b.dataset.id);Y.openModal(Y.modalHead('付款说明，等待人工核对')+'<form id="claim-payment-form" data-order="'+E(b.dataset.id)+'"><label class="field"><span>付款方式</span><select id="claim-method"><option value="wechat">微信</option><option value="alipay">支付宝</option></select></label><label class="field"><span>付款时间、交易尾号或订单号（不要填写密码或完整银行卡号）</span><textarea id="claim-reference" required maxlength="160">'+E(order?.reference||'')+'</textarea></label><p class="zh">提交后状态为待核对，不自动开通订阅。</p><button class="primary" type="submit">提交付款说明</button><div id="billing-error" role="alert"></div></form>')}else if(a==='billing-settings'){const r=await Y.api('/api/admin/billing');if(!same(c))return true;Y.ui.billingDraft={...r.billing};const x=r.billing;Y.openModal(Y.modalHead('管理员收款设置')+'<form id="billing-form"><label class="field"><span>计划名称</span><input id="billing-name" required maxlength="100" value="'+E(x.planName||'月度训练订阅（30天）')+'"></label><div class="form-grid"><label class="field"><span>人民币价格（元）</span><input id="billing-price" type="number" min="0.01" step="0.01" required value="'+(x.priceCents==null?'':x.priceCents/100)+'"></label><label class="field"><span>每次开通天数</span><input id="billing-days" type="number" min="1" max="3660" required value="'+E(x.days||30)+'"></label></div><label class="field"><span>核对与联系说明</span><textarea id="billing-contact" maxlength="1000">'+E(x.contact||'')+'</textarea></label>'+[['wechatQr','微信收款码'],['alipayQr','支付宝收款码']].map(([k,n])=>'<label class="field"><span>'+n+'（保留原图，2MB以内）</span><input type="file" accept="image/png,image/jpeg,image/webp" data-payment-qr="'+k+'"></label><div id="preview-'+k+'">'+(x[k]?'<img class="qr-mini" src="'+E(x[k])+'" alt="当前'+n+'">':'未配置')+'</div>').join('')+'<button class="primary" type="submit">保存收款设置</button><div id="billing-error" role="alert"></div></form>')}else if(a==='admin-orders'){await getOrders(true)}else if(['confirm-payment','reject-payment'].includes(a)){Y.openModal(Y.modalHead(a==='confirm-payment'?'核对真实到账后开通':'记录未确认原因')+'<form id="order-review-form" data-order="'+b.dataset.id+'" data-decision="'+(a==='confirm-payment'?'confirm':'reject')+'"><p class="zh">'+(a==='confirm-payment'?'请已在微信或支付宝中核对该订单的到账金额、付款人和时间，再提交。重复确认不会重复延长。':'写清未确认原因，方便学生补充说明。')+'</p><label class="field"><span>核对记录 / 处理备注</span><textarea id="order-note" required maxlength="1000"></textarea></label><button class="primary" type="submit">保存处理结果</button><div id="billing-error" role="alert"></div></form>')}else if(a==='grant-subscription'){Y.openModal(Y.modalHead('手动延长账户订阅')+'<form id="grant-form"><label class="field"><span>学生账户编号（管理员用户列表可查）</span><input id="grant-user" type="number" min="1" required></label><label class="field"><span>延长天数</span><input id="grant-days" type="number" min="1" max="3660" value="30" required></label><label class="field"><span>开通原因</span><textarea id="grant-reason" required maxlength="1000"></textarea></label><button class="primary" type="submit">记录并开通</button><div id="billing-error" role="alert"></div></form>')}else return false}catch(e){if(same(c))Y.toast(e.message)}return true};
Y.subscriptionChange=el=>{if(!el.dataset.paymentQr)return false;const file=el.files?.[0],c=context();if(!file)return true;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>2*1024*1024){Y.toast('请选择2MB以内的PNG、JPEG或WebP原图');return true}const reader=new FileReader();reader.onload=()=>{if(!same(c)||!Y.ui.billingDraft)return;Y.ui.billingDraft[el.dataset.paymentQr]=reader.result;const box=document.getElementById('preview-'+el.dataset.paymentQr);if(box)box.innerHTML='<img class="qr-mini" src="'+E(reader.result)+'" alt="待保存收款码原图">'};reader.readAsDataURL(file);return true};
Y.subscriptionSubmit=async form=>{if(!['claim-payment-form','billing-form','order-review-form','grant-form'].includes(form.id))return false;const c=context(),button=form.querySelector('button[type=submit]');button.disabled=true;try{if(form.id==='claim-payment-form')await Y.api('/api/orders/'+form.dataset.order+'/claim',{reference:document.getElementById('claim-reference').value,paymentMethod:document.getElementById('claim-method').value});else if(form.id==='billing-form'){const price=document.getElementById('billing-price').value;if(!/^\d+(\.\d{1,2})?$/.test(price))throw Error('价格最多保留两位小数');await Y.api('/api/admin/billing',{planName:document.getElementById('billing-name').value,priceCents:Math.round(Number(price)*100),days:Number(document.getElementById('billing-days').value),contact:document.getElementById('billing-contact').value,wechatQr:Y.ui.billingDraft.wechatQr||'',alipayQr:Y.ui.billingDraft.alipayQr||''},'PUT')}else if(form.id==='order-review-form')await Y.api('/api/admin/orders/'+form.dataset.order+'/'+form.dataset.decision,{note:document.getElementById('order-note').value});else await Y.api('/api/admin/subscriptions/grant',{userId:Number(document.getElementById('grant-user').value),days:Number(document.getElementById('grant-days').value),reason:document.getElementById('grant-reason').value});if(!same(c))return true;Y.closeModal();await Y.refreshMembership(true);if(!same(c))return true;if(Y.user?.role==='admin')await getOrders(true);else await getOrders();if(same(c))Y.toast(form.id==='claim-payment-form'?'付款说明已提交，等待核对；没有自动开通':'处理结果已保存')}catch(e){if(same(c)){const box=document.getElementById('billing-error');if(box)box.textContent=e.message}}finally{if(same(c))button.disabled=false}return true};
Y.extraViews.subscription=Y.subscriptionView;
const priorStart=Y.start;Y.start=async()=>{await priorStart();await Y.refreshMembership();Y.render()};
setInterval(async()=>{if(!Y.user||offline())return;const c=context(),before=Y.membership?.status;await Y.refreshMembership();if(same(c)&&before!==Y.membership?.status)Y.render()},60000);
})();

</script><script>
(function(){
const Y=window.YX,E=Y.esc,main=document.getElementById('main');
const levels={foundation:'基础薄弱',basic:'基础一般',intermediate:'中等水平',advanced:'较高水平'};
const variantText=(s,v)=>{const x=s.variants?.[v];return [s.salutation,x?.opening.en||s.opening,['A','B','C'].map(k=>x?.[k].en||s.abc[k][0].en).join(' '),x?.closing.en||s.closing,s.signature].filter(Boolean).join('\n\n')};
Y.variantText=variantText;
Y.onboarding=()=>Y.openModal(Y.modalHead('建立你的学习起点')+'<div class="eyebrow">WELCOME TO 研写 LAB</div><p class="zh">先确定目标；基础内容面向应用文通用能力，不把本站训练分类当作官方必考清单。</p><form id="onboarding-form"><div class="form-grid"><div class="field"><label for="profile-exam">考试类型</label><select id="profile-exam"><option value="one" '+(Y.store.profile.exam==='one'?'selected':'')+'>英语一</option><option value="two" '+(Y.store.profile.exam==='two'?'selected':'')+'>英语二</option></select></div><div class="field"><label for="profile-level">目前基础</label><select id="profile-level">'+Object.entries(levels).map(([k,v])=>'<option value="'+k+'" '+(Y.store.profile.level===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="field wide"><label for="profile-goal">学习目标</label><select id="profile-goal">'+[7,14,30].map(n=>'<option value="'+n+'" '+(Number(Y.store.profile.goal)===n?'selected':'')+'>'+n+' 天 · '+({7:'认识题型与基本结构',14:'完成替换与分题型训练',30:'独立写作、计时与复盘'}[n])+'</option>').join('')+'</select></div></div><button class="primary" type="submit">保存设置，开始学习 ↗</button></form><p class="modal-footer">'+(Y.user?'登录后记录存入个人账户。':'当前可直接在本地学习；账户模式需运行配套服务。')+'所有成绩来自你的实际练习。</p>');
function dashboard(){const done=new Set(Y.store.essays.map(e=>e.type)).size;const mastered=new Set(Y.store.attempts.filter(a=>['fill','choice'].includes(a.kind)&&a.correct).map(a=>a.question)).size;const missing=Y.types.find(t=>!Y.store.essays.some(e=>e.type===t.id))||Y.types[0];const last=Y.store.last&&{dirty:!!(Y.store.drafts[Y.store.last.scenario]?.dirty||Y.store.drafts[Y.store.last.scenario]?.manual||Y.store.workspace?.practice?.[Y.store.last.scenario]?.full||Y.store.workspace?.practice?.[Y.store.last.scenario]?.translation||Y.store.exam?.text&&Y.store.exam.status!=='submitted')};const errCount={};Y.store.errors.forEach(e=>errCount[e.knowledge||'信息与表达']=(errCount[e.knowledge||'信息与表达']||0)+1);const errors=Object.entries(errCount).sort((a,b)=>b[1]-a[1]).slice(0,3);return '<div class="hero"><div><div class="eyebrow">2027 & BEYOND / ENGLISH WRITING</div><h1>一套写作逻辑，<br>从模板走向独立表达。</h1><p>理解任务，组织信息，再选择自然的英语。<br>把首段、中段和尾段连成一次真正有效的沟通。</p><div class="actions"><button class="primary" data-action="go" data-view="lab">开始训练 ↗</button><button data-action="continue">继续上次学习</button></div><div class="chips" style="margin-top:21px"><span>英语'+(Y.store.profile.exam==='two'?'二':'一')+'</span><span>'+levels[Y.store.profile.level]+'</span><span>'+Y.store.profile.goal+' 天目标</span><button class="text small" data-action="onboarding">调整学习设置</button></div></div><div class="dark-note"><div class="eyebrow">YOUR REUSABLE FRAMEWORK</div><div class="abc-line"><span>A</span><div><strong>具体内容</strong><small>把题目要求的事情说清楚</small></div></div><div class="abc-line"><span>B</span><div><strong>原因或影响</strong><small>解释内容的价值、理由或后果</small></div></div><div class="abc-line"><span>C</span><div><strong>交际功能</strong><small>提出行动，回应这封信的目的</small></div></div><div class="dark-foot">首段说明目的 / 尾段按任务收束</div></div></div><div class="stats"><div class="stat"><strong>'+done+' <span class="muted" style="font-size:16px">/ '+Y.types.length+'</span></strong><small>已写过的应用文类型</small></div><div class="stat"><strong>'+Y.store.essays.length+'</strong><small>真实保存的作文</small></div><div class="stat"><strong>'+mastered+'</strong><small>答对过的关键表达练习</small></div><div class="stat"><strong>'+Y.store.errors.filter(e=>e.status!=='mastered').length+'</strong><small>需要继续复习的问题</small></div></div><div class="grid2"><section><div class="section-title"><h2>今天的学习路线</h2><small>按实际记录推荐</small></div><div class="row"><div><h3>01 / '+(Object.keys(Y.store.courses).length?'继续基础课程':'先理解首中尾的任务')+'</h3><p>每课包含讲解、例句、问答与复习测试。</p></div><button class="small" data-action="go" data-view="courses">学习 →</button></div><div class="row"><div><h3>02 / '+E(missing.name)+'专项练习</h3><p>先看题型，再完成一封约 100 词应用文。</p></div><button class="small" data-action="open-type" data-type="'+missing.id+'">训练 →</button></div><div class="row"><div><h3>03 / '+(Y.store.errors.length?'回顾已记录的问题':'尝试撤除模板')+'</h3><p>'+(Y.store.errors.length?'到期问题会在错题本中置顶。':'分四个阶段，逐渐减少句型提示。')+'</p></div><button class="small" data-action="go" data-view="'+(Y.store.errors.length?'errors':'practice')+'">开始 →</button></div></section><section><div class="section-title"><h2>你的学习状态</h2><small>'+E(Y.today())+'</small></div><div class="notice"><strong>'+ (last?.dirty?'有一份未提交草稿':'还没有未完成的草稿')+'</strong><br>'+(last?.dirty?E(Y.allScenarios().find(s=>s.id===Y.store.last.scenario)?.title||'当前作文')+'。可以继续上次编辑。':'选择一道题，从说明具体事情开始。')+'</div><div class="row"><div><h3>当前计划</h3><p>'+Y.store.plan.days+' 天计划 / 已记录 '+Y.store.plan.completed.length+' 项行动。掌握情况还需要结合练习。</p></div><button class="small" data-action="go" data-view="plan">查看</button></div><div class="row"><div><h3>最近表现</h3><p>'+(Y.store.attempts.length?'最近 '+Math.min(5,Y.store.attempts.length)+' 次记录中，完成 '+Y.store.attempts.slice(-5).filter(a=>a.kind==='composition').length+' 次写作、答对 '+Y.store.attempts.slice(-5).filter(a=>a.correct).length+' 道练习。':'尚无练习记录，首页不会预置成绩。')+'</p></div></div><div class="row"><div><h3>高频问题</h3><p>'+ (errors.length?errors.map(([k,n])=>E(k)+' '+n+' 次').join(' / '):'尚未记录错误。发现问题后可进入错题本复盘。')+'</p></div></div></section></div><section cl ions"><button class="primary" type="submit">提交本课测试</button><button type="button" data-action="next-course">下一课 →</button></div></form>'+(saved.checked?'<p class="float-note">本次 '+saved.score+' / '+c.quiz.length+'，'+(saved.completed?'已通过本课复习。':'请理解解析后重做，完成不等于掌握。')+'</p>':'')+'</section>'+(c.sources?'<section class="section"><h3>课程依据与资料边界</h3><p class="float-note">'+E(c.sourceNote)+'</p>'+c.sources.map(s=>'<p class="zh"><a href="'+E(s.url)+'" target="_blank" rel="noopener noreferrer">'+E(s.title)+' ↗</a></p>').join('')+'</section>':'')+'</article></div>'}
