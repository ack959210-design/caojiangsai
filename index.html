function questions(){const f=Y.ui.questions,tags=[...new Set(Y.allScenarios().flatMap(s=>s.tags||[]))];return Y.heading('ORIGINAL PRACTICE BANK','原创模拟题库','按功能与主题练习。本站不提供未经核验的所谓真题或官方预测。')+'<div class="toolbar"><input id="question-search" class="input" type="search" placeholder="搜索主题、题目或 Directions…" value="'+E(f.q)+'"><select class="input" data-question-filter="type" aria-label="题库题型"><option value="all">全部题型</option>'+Y.types.map(t=>'<option value="'+t.id+'" '+(f.type===t.id?'selected':'')+'>'+E(t.name)+'</option>').join('')+'</select><select class="input" data-question-filter="exam" aria-label="考试类型">'+[['all','英语一 / 二通用'],['one','英语一训练'],['two','英语二训练']].map(([k,v])=>'<option value="'+k+'" '+(f.exam===k?'selected':'')+'>'+v+'</option>').join('')+'</select><select class="input" data-question-filter="theme" aria-label="题库主题"><option value="all">全部主题</option>'+tags.map(t=>'<option '+(t===f.theme?'selected':'')+'>'+E(t)+'</option>').join('')+'</select><select class="input" data-question-filter="difficulty" aria-label="题库难度">'+[['all','全部难度'],['basic','基础'],['standard','标准'],['advanced','进阶']].map(([k,v])=>'<option value="'+k+'" '+(f.difficulty===k?'selected':'')+'>'+v+'</option>').join('')+'</select><select class="input" data-question-filter="status" aria-label="完成状态">'+[['all','全部状态'],['new','尚未写作'],['done','已有作文']].map(([k,v])=>'<option value="'+k+'" '+(f.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div id="question-results">'+Y.questionResults()+'</div>'}
function records(){return Y.heading('YOUR WRITING ARCHIVE','我的作文','每次保存都留下真实记录。查看原文、继续修改，或对当前版本进行批改。','<button data-action="json-backup">导出学习备份</button><button data-action="draft-history">保护草稿历史</button>')+(Y.store.essays.length?Y.store.essays.slice().reverse().map(e=>'<article class="record"><h3>'+E(e.title)+'</h3><div class="meta">'+E(Y.types.find(t=>t.id===e.type)?.name||'自定义')+' / '+E(Y.date(e.createdAt))+' / '+e.words+' 词 / 版本 '+e.version+'</div><p>'+E(e.content)+'</p><div class="actions"><button class="small" data-action="restore-essay" data-id="'+e.id+'">重新打开</button><button class="small" data-action="record-copy" data-id="'+e.id+'">复制原文</button><button class="small" data-action="record-review" data-id="'+e.id+'">批改当前版本</button><button class="small" data-action="record-export" data-id="'+e.id+'">导出讲义</button></div></article>').join(''):'<div class="empty"><p>还没有保存作文。先完成一个交际任务，再留下自己的表达。</p><button class="primary" data-action="go" data-view="lab">写第一篇作文 ↗</button></div>')}
function settings(){return Y.heading('YOUR PERSONAL SPACE','账户与设置','学习设置、数据备份与身份由真实记录和账户服务管理。')+'<div class="grid2"><section class="panel"><div class="panel-head">学习设置</div><div class="panel-body"><p>英语'+(Y.store.profile.exam==='two'?'二':'一')+' / '+levels[Y.store.profile.level]+' / '+Y.store.profile.goal+' 天目标</p><div class="actions"><button data-action="onboarding">修改学习设置</button><button data-action="json-backup">导出备份</button><button data-action="copy-backup">复制备份</button><button data-action="draft-history">保护草稿历史</button></div><label class="field" style="margin-top:20px"><span>导入研写Lab备份 JSON</span><input type="file" id="import-backup" accept=".json,application/json"></label><button class="small" data-action="import-legacy">导入当前浏览器的旧版训练记录</button><p class="float-note">导入会先展示数量，确认后合并。新旧记录都有保留，不自动覆盖账户数据。</p></div></section><section class="panel"><div class="panel-head">账户与服务状态</div><div class="panel-body"><p>'+(Y.user?'已登录：'+E(Y.user.name)+' / '+({student:'学生',teacher:'教师',admin:'管理员'}[Y.user.role]):'当前为本地学习；无需账户也可学习课程和保存个人作文。')+'</p><p class="zh">账户服务：'+(Y.config.server?'已连接，SQLite 持久保存与权限隔离可用。':'未连接。请启动配套服务后使用登录、班级与作业。')+'</p><p class="zh">AI 服务：'+(Y.config.aiAvailable?'服务端已配置。真实调用仍取决于账户、额度与网络。':'尚未配置。课程、编辑与规则自查仍可用；不会生成假评分。')+'</p><div class="actions"><button data-action="account">'+(Y.user?'账户信息':'登录 / 注册')+'</button>'+(Y.user?'<button data-action="logout">退出登录</button>':'')+'</div></div></section></div><section class="section"><h2>数据与产品边界</h2><p class="zh">本地记录只存在当前浏览器。登录后数据属于当前账户，教师只能查看自己班级中的作业提交；不会看到学生的私有草稿。公开静态版本不提供账户后端，部署账户版需要运行服务器并设置服务域名和密钥。</p><p class="zh">课程的三句式和长度提醒属于教学工具，不是官方固定评分公式。AI分数为参考估计，不是官方阅卷分数；服务不可用时会显示失败原因并保留原文。</p></section>'}
Y.views={dashboard,courses,types,library,questions,records,settings,lab:Y.labView,...Y.extraViews};
Y.render=()=>{const view=Y.names[Y.ui.view]?Y.ui.view:'dashboard';document.getElementById('page-title').textContent=Y.names[view];document.getElementById('nav').innerHTML=Object.entries(Y.names).map(([k,v],i)=>'<a href="#'+k+'" class="'+(k===view?'active':'')+'" '+(k===view?'aria-current="page"':'')+'><span class="nav-symbol">'+Y.icons[i]+'</span>'+v+'</a>').join('');const gated=Y.memberGate?.(view);main.innerHTML=gated?Y.lockScreen():(Y.views[view]||(()=>Y.heading('LOADING',Y.names[view],'模块正在加载，请刷新页面。')))();Y.updateSync();if(!gated&&view==='lab')Y.updateLab();if(view==='exam')Y.updateTimer?.();if(!gated&&view==='teacher')Y.loadTeacher?.();document.getElementById('sidebar').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false')};
Y.account=()=>{if(Y.user){Y.openModal(Y.modalHead('个人账户')+'<p>'+E(Y.user.name)+' / '+E(Y.user.email)+'</p><p>当前权限：'+E({student:'学生',teacher:'教师',admin:'管理员'}[Y.user.role])+'</p><div class="actions"><button data-action="logout">退出登录</button><button data-action="go" data-view="teacher">班级与作业</button></div>');return}if(!Y.config.server){Y.openModal(Y.modalHead('账户服务未连接')+'<p>本地课程与训练可继续使用。真实账户、教师权限和班级作业需要启动随网站提供的账户服务。</p><p class="zh">启动方式与管理员初始化步骤见交付的部署说明。仅在浏览器切换身份，不会获得教师或管理员权限。</p>');return}Y.openModal(Y.modalHead(Y.ui.accountMode==='register'?'注册学生账户':'登录账户')+'<div class="tabs"><button data-action="account-mode" data-mode="login" class="'+(Y.ui.accountMode==='login'?'active':'')+'">登录</button><button data-action="account-mode" data-mode="register" class="'+(Y.ui.accountMode==='register'?'active':'')+'">注册</button>'+(Y.config.setupAvailable?'<button data-action="account-mode" data-mode="setup">初始化管理员</button>':'')+'</div><form id="account-form">'+(Y.ui.accountMode!=='login'?'<div class="field"><label for="account-name">姓名 / 昵称</label><input id="account-name" required maxlength="50"></div>':'')+'<div class="field"><label for="account-email">邮箱</label><input id="account-email" type="email" required autocomplete="username"></div><div class="field"><label for="account-password">密码</label><input id="account-password" type="password" required minlength="8" autocomplete="'+(Y.ui.accountMode==='login'?'current-password':'new-password')+'"></div>'+(Y.ui.accountMode==='register'?'<div class="field"><label for="account-invite">教师邀请码（学生可留空）</label><input id="account-invite" autocomplete="off"></div>':'')+(Y.ui.accountMode==='setup'?'<div class="field"><label for="setup-token">首次初始化令牌</label><input id="setup-token" type="password" required autocomplete="off"></div>':'')+'<button class="primary" type="submit">'+(Y.ui.accountMode==='login'?'登录':'创建账户')+'</button><div id="account-error" role="alert"></div></form><p class="modal-footer">教师身份由管理员邀请授予；学生私有记录与班级提交分别保存。</p>')};
async function commonAction(a,b){if(Y.subscriptionAction&&await Y.subscriptionAction(a,b))return true;if(Y.labAction(a,b))return true;for(const handler of [Y.featureAction,Y.reviewAction,Y.teacherAction])if(handler&&await handler(a,b))return true;if(Y.exportAction&&Y.exportAction(a,b))return true;if(a==='go'){Y.closeModal();Y.go(b.dataset.view)}else if(a==='close-modal')Y.closeModal();else if(a==='type'){Y.selectType(b.dataset.type);Y.render()}else if(a==='open-type'){Y.selectType(b.dataset.type);Y.go('types')}else if(a==='continue'){if(Y.store.last){const last={...Y.store.last};Y.selectScenario(last.scenario);Y.ui.stage=last.stage||1;Y.ui.course=last.course||0;Y.go(Y.names[last.view]?last.view:'lab')}else Y.go('courses')}else if(a==='onboarding')Y.onboarding();else if(a==='course'){Y.ui.course=Number(b.dataset.index);Y.render()}else if(a==='next-course'){Y.ui.course=(Y.ui.course+1)%Y.courses.length;Y.render();window.scrollTo({top:0})}else if(a==='type-variant'){Y.ui.typeVariant=b.dataset.variant;Y.render()}else if(a.startsWith('bank-')){const entry=Y.bank().find(e=>e.id===b.dataset.id)||Y.store.favorites.find(e=>e.id===b.dataset.id);if(!entry)return true;if(a==='bank-copy')Y.copy(entry.en);else if(a==='bank-favorite'){const found=Y.store.favorites.findIndex(x=>x.id===entry.id);if(found>=0)Y.store.favorites.splice(found,1);else Y.store.favorites.push({...entry});Y.persist();Y.render()}else if(a==='bank-review'){Y.store.reviewsDue[entry.id]={...entry,due:new Date().toISOString()};Y.persist();Y.toast('已加入复习计划')}else if(a==='bank-use'){Y.selectScenario(entry.scenario);const slot=entry.slot;if(Y.labGuard(slot)){Y.draft().fields[slot]={en:entry.en,zh:entry.zh,choice:entry.choice??-1};Y.touchDraft();Y.go('lab')}}}else if(a==='draft-history'){Y.openModal(Y.modalHead('保护的草稿与历史原文')+(Y.store.draftHistory.length?Y.store.draftHistory.slice().reverse().map(h=>'<div class="record"><h3>'+E(h.title)+'</h3><p class="zh">'+E(h.reason||'自动保护')+'</p><div class="review-source" style="font-size:16px">'+E(h.content||Y.textFromDraft(h.draft||{}))+'</div><button class="small" data-action="restore-protected" data-id="'+h.id+'">恢复这份草稿</button></div>').join(''):'<p class="zh">尚未产生恢复或导入前的保护版本。</p>'))}else if(a==='restore-protected'){const h=Y.store.draftHistory.find(x=>x.id===b.dataset.id);if(h?.draft&&Y.allScenarios().some(s=>s.id===h.scenario)){Y.protectDraft(h.scenario,'恢复保护草稿前保留');Y.selectScenario(h.scenario);Y.store.drafts[h.scenario]=structuredClone(h.draft);Y.persist();Y.closeModal();Y.go('lab');Y.toast('已恢复保护草稿，现有输入仍保留在历史中')}else if(h?.content)Y.copy(h.content)}else if(a==='only-favorites'){Y.ui.library.favorite=!Y.ui.library.favorite;Y.render()}else if(a.startsWith('question-')){Y.selectScenario(b.dataset.scenario);if(a==='question-reference'){const s=Y.scenario();Y.openModal(Y.modalHead(s.title+'参考')+'<p class="en">'+E(variantText(s,'basic')).replace(/\n/g,'<br>')+'</p>'+Y.pointList(s.points))}else Y.go({ 'question-lab':'lab','question-analyze':'analysis','question-exam':'exam'}[a]||'lab')}else if(a==='restore-essay')Y.restoreEssay(b.dataset.id);else if(a.startsWith('record-')){const e=Y.store.essays.find(x=>x.id===b.dataset.id);if(a==='record-copy')Y.copy(e.content);else if(a==='record-export')Y.exportDialog('个人作文',[{title:e.title,en:e.content,zh:e.translation}]);else if(a==='record-review'){Y.selectScenario(e.scenario);Y.ui.reviewEssay=e.id;Y.ui.reviewText=e.content;Y.ui.reviewResult=Y.store.reviews.find(r=>r.essayId===e.id&&r.version===e.version)||null;Y.go('review')}}else if(a==='account')Y.account();else if(a==='account-mode'){Y.ui.accountMode=b.dataset.mode;Y.account()}else if(a==='logout'){await Y.flush();await Y.api('/api/logout',{});Y.user=null;Y.load();Y.resetPrivateUI();await Y.refreshMembership?.();if(Y.loadPhoto)await Y.loadPhoto();Y.closeModal();Y.render();Y.toast('已退出，切回本地学习空间')}else if(a==='copy-backup')Y.copy(JSON.stringify({app:'研写Lab',schema:2,state:Y.store},null,2));else if(a==='import-legacy'){let old;try{old=JSON.parse(localStorage.getItem('paragraph-camp-v1')||'null')}catch{}if(!old?.records?.length){Y.toast('当前浏览器未找到旧版训练存档');return true}if(confirm('发现 '+old.records.length+' 篇旧版作文。合并到当前空间吗？')){for(const r of old.records){const scenario=Y.types.find(t=>t.id===r.type)?.scenarios[r.scenario];if(scenario&&!Y.store.essays.some(e=>e.id===r.id))Y.store.essays.push({id:r.id,type:r.type,scenario:scenario.id,title:r.title,content:r.full,translation:'',version:1,createdAt:r.time,words:Y.words(r.full),kind:'legacy'})}Y.persist();Y.toast('已合并旧版作文记录')}}else if(a.startsWith('export-')){const s=Y.scenario();if(a==='export-course'){const c=Y.courses[Y.ui.course];Y.exportDialog(c.title,c.sections.map(x=>({title:x.title,body:x.body,en:x.exampleEn,zh:x.exampleZh})))}else if(a==='export-type')Y.exportDialog(Y.type().name+'训练讲义',[{title:s.title,en:variantText(s,'standard'),zh:[s.openingZh,...['A','B','C'].map(k=>s.abc[k][0].zh),s.closingZh].join('\n'),points:s.points}]);else if(a==='export-library')Y.exportDialog('功能句练习讲义',Y.bank().filter(e=>Y.ui.library.type==='all'||e.type===Y.ui.library.type).slice(0,60).map(e=>({title:e.typeName+' '+e.function,en:e.en,zh:e.zh})))}else return false;return true}
document.addEventListener('click',async event=>{const b=event.target.closest('[data-action]');if(!b)return;try{await commonAction(b.dataset.action,b)}catch(e){Y.toast(e.message||'操作未完成；输入已保留。')}});
document.addEventListener('input',e=>{const el=e.target;if(Y.labInput(el))return;for(const handler of [Y.featureInput,Y.reviewInput,Y.teacherInput])if(handler?.(el))return;if(el.id==='bank-search'){Y.ui.library.q=el.value;document.getElementById('bank-results').innerHTML=Y.libraryResults()}else if(el.id==='question-search'){Y.ui.questions.q=el.value;document.getElementById('question-results').innerHTML=Y.questionResults()}else if(el.dataset.courseWork){const id=el.dataset.courseWork;Y.store.courses[id]=Y.store.courses[id]||{};Y.store.courses[id].openAnswer=el.value;Y.persist()}});
document.addEventListener('change',async e=>{const el=e.target;if(Y.labChange(el))return;for(const handler of [Y.subscriptionChange,Y.featureChange,Y.reviewChange,Y.teacherChange])if(handler&&await handler(el))return;if(el.id==='scenario-select'){Y.selectScenario(el.value);Y.render()}else if(el.dataset.bankFilter){Y.ui.library[el.dataset.bankFilter]=el.value;Y.render()}else if(el.dataset.questionFilter){Y.ui.questions[el.dataset.questionFilter]=el.value;Y.render()}else if(el.id==='import-backup'){const file=el.files[0];if(!file)return;try{const value=JSON.parse(await file.text());if(value.app!=='研写Lab'||!value.state||!Array.isArray(value.state.essays))throw Error('不是有效的研写Lab备份');if(confirm('备份含 '+value.state.essays.length+' 篇作文。合并作文、收藏与错题到当前空间吗？同题草稿另存历史，不覆盖当前输入。')){const incoming=Y.validStore(value.state);for(const k of ['essays','favorites','errors','attempts','reviews'])for(const x of incoming[k])if(!Y.store[k].some(v=>v.id===x.id))Y.store[k].push(x);for(const [key,draft] of Object.entries(incoming.drafts)){if(Y.store.drafts[key]){Y.store.draftHistory.push({id:Y.id('import-history'),scenario:key,type:draft.type,title:'导入的同题草稿',reason:'备份合并：保留当前输入，导入草稿另存历史',content:typeof draft.manual==='string'?draft.manual:Y.textFromDraft(draft),draft:structuredClone(draft),createdAt:new Date().toISOString()})}else Y.store.drafts[key]=draft;}Y.persist();Y.render();Y.toast('备份已合并')}}catch(err){Y.toast(err.message||'无法读取备份')}}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target;if(form.id==='onboarding-form'){Y.store.profile={exam:document.getElementById('profile-exam').value,level:document.getElementById('profile-level').value,goal:Number(document.getElementById('profile-goal').value),onboarded:true};Y.store.plan.days=Y.store.profile.goal;Y.persist();Y.closeModal();Y.render();Y.toast('学习设置已保存')}else if(form.id==='course-quiz'){const c=Y.courses[Y.ui.course],answers={},fd=new FormData(form);if(c.quiz.some(q=>!fd.has(q.id))){Y.toast('请完成每一道复习题');return}let score=0;for(const q of c.quiz){answers[q.id]=Number(fd.get(q.id));const correct=answers[q.id]===q.answer;if(correct)score++;else Y.addError({sourceId:q.id,original:q.options[answers[q.id]],correction:q.options[q.answer],reason:q.explanation,knowledge:q.knowledge,question:q.question,kind:'choice',course:Y.ui.course});Y.store.attempts.push({id:Y.id('quiz'),kind:'course',question:q.id,correct,time:new Date().toISOString(),type:Y.ui.type})}Y.store.courses[c.id]={...(Y.store.courses[c.id]||{}),answers,score,checked:true,completed:score===c.quiz.length};Y.persist();Y.render();Y.toast('答案与解析已显示')}else if(form.id==='account-form'){const button=form.querySelector('button[type=submit]');button.disabled=true;try{const mode=Y.ui.accountMode,body={email:document.getElementById('account-email').value,password:document.getElementById('account-password').value};if(mode!=='login')body.name=document.getElementById('account-name').value;if(mode==='register')body.invite=document.getElementById('account-invite').value;if(mode==='setup')body.token=document.getElementById('setup-token').value;const result=await Y.api('/api/'+({login:'login',register:'register',setup:'setup'}[mode]),body);Y.user=result.user;Y.load();const saved=await Y.api('/api/state');Y.store=Y.validStore(saved.state);Y.resetPrivateUI();await Y.refreshMembership?.();if(Y.loadPhoto)await Y.loadPhoto();Y.persist();Y.closeModal();Y.render();if(!Y.store.profile.onboarded)Y.onboarding();Y.toast('已进入个人账户空间')}catch(err){document.getElementById('account-error').textContent=err.message}finally{button.disabled=false}}else for(const handler of [Y.subscriptionSubmit,Y.featureSubmit,Y.reviewSubmit,Y.teacherSubmit])if(handler&&await handler(form))break});
document.getElementById('menu').addEventListener('click',()=>{const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('menu').setAttribute('aria-expanded',String(open))});
document.getElementById('account-button').addEventListener('click',Y.account);
document.getElementById('global-search').addEventListener('click',()=>{Y.go('questions');setTimeout(()=>document.getElementById('question-search')?.focus(),0)});
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView({block:'start'})});
window.addEventListener('hashchange',()=>{Y.ui.view=Y.names[location.hash.slice(1)]?location.hash.slice(1):'dashboard';Y.render();window.scrollTo({top:0,behavior:'instant'})});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))Y.closeModal()});
Y.ui.view=Y.names[location.hash.slice(1)]?location.hash.slice(1):'dashboard';Y.start();
})();
